name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  generic:
    name: Generic checks
    runs-on: ubuntu-latest

    steps:
      - name: Run shared repository checks
        uses: black-desk/workflows/generic@master
        env:
          # Unified patches preserve upstream context whitespace verbatim.
          CLEAN_IGNORE: "*.patch"

  format:
    name: Format checks
    runs-on: ubuntu-latest

    steps:
      - name: Check source formatting
        uses: black-desk/workflows/format@master

  checks:
    name: Dependency graph tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Run dependency graph tests
        run: pixi run graph-test

      - name: Run package pipeline tests
        run: pixi run pipeline-test

  checks-pass:
    name: checks-pass
    if: always()
    needs:
      - generic
      - format
      - checks
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
