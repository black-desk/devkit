name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  generic:
    name: Generic checks
    runs-on: ubuntu-latest

    steps:
      - name: Run shared repository checks
        uses: black-desk/workflows/generic@master

  format:
    name: Format checks
    runs-on: ubuntu-latest

    steps:
      - name: Check source formatting
        uses: black-desk/workflows/format@master

  checks:
    name: Dependency graph tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Run dependency graph tests
        run: pixi run graph-test

  checks-pass:
    name: checks-pass
    if: always()
    needs:
      - generic
      - format
      - checks
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@cf8c7153660700b299cfb670306bdafa48ebb748 # v1.0.0
        with:
          jobs: ${{ toJSON(needs) }}
