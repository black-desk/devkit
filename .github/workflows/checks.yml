name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  generic:
    name: Generic checks
    runs-on: ubuntu-latest

    steps:
      - name: Run shared repository checks
        uses: black-desk/workflows/generic@master

  format:
    name: Format checks
    runs-on: ubuntu-latest

    steps:
      - name: Check source formatting
        uses: black-desk/workflows/format@master

  checks:
    name: Dependency graph tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          cache: true
          run-install: true

      - name: Run dependency graph tests
        run: pixi run graph-test

  affected-packages:
    name: Affected package builds
    needs:
      - generic
      - format
      - checks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          cache: true
          run-install: true

      - name: Build affected packages
        env:
          DEVKIT_CHANNEL: https://prefix.dev/black-desk
          BASE_SHA: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event.before
            }}
        run: pixi run bash scripts/affected-build.sh "$BASE_SHA"

      - name: Publish affected packages
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          PREFIX_CHANNEL: black-desk
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: pixi run publish-result

  pass:
    name: pass
    if: always()
    needs:
      - generic
      - format
      - checks
      - affected-packages
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
