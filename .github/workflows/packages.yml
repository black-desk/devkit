name: Packages

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PLAN_FILE: ${{ github.workspace }}/.build-output/affected-plan.json
  DEVKIT_CHANNEL: https://prefix.dev/black-desk

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bootstrap_required: ${{ steps.plan.outputs.bootstrap_required }}
      bootstrap_build_required: ${{ steps.bootstrap.outputs.build_required }}
      bootstrap_cache_key: ${{ steps.fingerprint.outputs.key }}
      ordinary_required: ${{ steps.plan.outputs.ordinary_required }}
      build_required: ${{ steps.plan.outputs.build_required }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Validate revisions and write build plan
        id: plan
        env:
          BASE_SHA: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event.before
            }}
        run: pixi run bash scripts/affected-plan.sh "$BASE_SHA"

      - name: Fingerprint bootstrap inputs
        if: steps.plan.outputs.bootstrap_required == 'true'
        id: fingerprint
        run: python3 scripts/bootstrap-fingerprint.py

      - name: Restore tested bootstrap channel
        if: steps.plan.outputs.bootstrap_required == 'true'
        id: bootstrap-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build-output/selfhost-channel.tar.gz
          key: ${{ steps.fingerprint.outputs.key }}

      - name: Validate cached bootstrap channel
        if: steps.bootstrap-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p channels
          tar --extract --gzip --file .build-output/selfhost-channel.tar.gz --directory channels
          pixi run python scripts/channel-artifact.py verify --plan "$PLAN_FILE" \
            --channel channels/result-rebuild --stage selfhost

      - name: Select bootstrap execution
        id: bootstrap
        env:
          REQUIRED: ${{ steps.plan.outputs.bootstrap_required }}
          CACHE_HIT: ${{ steps.bootstrap-cache.outputs.cache-hit }}
        run: |
          build_required=false
          if [[ "$REQUIRED" == true && "$CACHE_HIT" != true ]]; then
            build_required=true
          fi
          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"
          echo "Bootstrap: required=$REQUIRED, cache-hit=${CACHE_HIT:-false}, build=$build_required" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cached selfhost channel
        if: steps.bootstrap-cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfhost-channel
          path: .build-output/selfhost-channel.tar.gz
          retention-days: 3
          if-no-files-found: error

      - name: Upload build plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-plan
          path: .build-output/affected-plan.json
          retention-days: 3
          if-no-files-found: error

  dirty:
    name: Dirty
    needs: [plan]
    if: needs.plan.outputs.bootstrap_build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Download build plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-plan
          path: .build-output

      - name: Build dirty generation
        run: pixi run bash scripts/bootstrap.sh dirty

      - name: Archive dirty channel
        run: >-
          tar --create --gzip --file .build-output/dirty-channel.tar.gz
          --directory channels dirty

      - name: Upload dirty channel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dirty-channel
          path: .build-output/dirty-channel.tar.gz
          retention-days: 3
          if-no-files-found: error

  result:
    name: Result
    needs: [plan, dirty]
    if: needs.plan.outputs.bootstrap_build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Download build plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-plan
          path: .build-output

      - name: Download dirty channel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dirty-channel
          path: .build-output

      - name: Extract dirty channel
        run: |
          mkdir -p channels
          tar --extract --gzip --file .build-output/dirty-channel.tar.gz --directory channels

      - name: Build result generation
        run: pixi run bash scripts/bootstrap.sh result

      - name: Archive result channel
        run: >-
          tar --create --gzip --file .build-output/result-channel.tar.gz
          --directory channels result

      - name: Upload result channel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-channel
          path: .build-output/result-channel.tar.gz
          retention-days: 3
          if-no-files-found: error

  selfhost:
    name: Selfhost
    needs: [plan, result]
    if: needs.plan.outputs.bootstrap_build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Download build plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-plan
          path: .build-output

      - name: Download result channel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: result-channel
          path: .build-output

      - name: Extract result channel
        run: |
          mkdir -p channels
          tar --extract --gzip --file .build-output/result-channel.tar.gz --directory channels

      - name: Build selfhost generation
        run: pixi run bash scripts/bootstrap.sh selfhost

      - name: Archive selfhost channel
        run: >-
          tar --create --gzip --file .build-output/selfhost-channel.tar.gz
          --directory channels result-rebuild

      - name: Upload selfhost channel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfhost-channel
          path: .build-output/selfhost-channel.tar.gz
          retention-days: 3
          if-no-files-found: error

  smoke:
    name: Test
    needs: [plan, selfhost]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.bootstrap_required == 'true' &&
      (needs.plan.outputs.bootstrap_build_required == 'false' || needs.selfhost.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Download build plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-plan
          path: .build-output

      - name: Download selfhost channel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selfhost-channel
          path: .build-output

      - name: Extract selfhost channel
        run: |
          mkdir -p channels
          tar --extract --gzip --file .build-output/selfhost-channel.tar.gz --directory channels

      - name: Test self-hosted generation
        run: pixi run bash scripts/bootstrap.sh test

      - name: Cache successfully tested bootstrap channel
        if: needs.plan.outputs.bootstrap_build_required == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build-output/selfhost-channel.tar.gz
          key: ${{ needs.plan.outputs.bootstrap_cache_key }}

  ordinary:
    name: Build
    needs: [plan, smoke]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.ordinary_required == 'true' &&
      (needs.plan.outputs.bootstrap_required == 'false' || needs.smoke.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Download build plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-plan
          path: .build-output

      - name: Download selfhost channel
        if: needs.plan.outputs.bootstrap_required == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selfhost-channel
          path: .build-output

      - name: Extract selfhost channel
        if: needs.plan.outputs.bootstrap_required == 'true'
        run: |
          mkdir -p channels
          tar --extract --gzip --file .build-output/selfhost-channel.tar.gz --directory channels

      - name: Build and test ordinary packages
        run: pixi run bash scripts/build-ordinary.sh

      - name: Archive ordinary channel
        run: >-
          tar --create --gzip --file .build-output/ordinary-channel.tar.gz
          --directory channels ordinary

      - name: Upload ordinary channel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ordinary-channel
          path: .build-output/ordinary-channel.tar.gz
          retention-days: 3
          if-no-files-found: error

  publish-packages:
    name: Publish
    needs: [plan, packages-pass]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.packages-pass.result == 'success' && needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true

      - name: Download build plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-plan
          path: .build-output

      - name: Download selfhost channel
        if: needs.plan.outputs.bootstrap_required == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selfhost-channel
          path: .build-output

      - name: Extract selfhost channel
        if: needs.plan.outputs.bootstrap_required == 'true'
        run: |
          mkdir -p channels
          tar --extract --gzip --file .build-output/selfhost-channel.tar.gz --directory channels

      - name: Download ordinary channel
        if: needs.plan.outputs.ordinary_required == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ordinary-channel
          path: .build-output

      - name: Extract ordinary channel
        if: needs.plan.outputs.ordinary_required == 'true'
        run: |
          mkdir -p channels
          tar --extract --gzip --file .build-output/ordinary-channel.tar.gz --directory channels

      - name: Assemble verified publication channel
        run: |
          inputs=()
          if [[ "$(jq -r '.bootstrap_required' "$PLAN_FILE")" == true ]]; then
            inputs+=(--input selfhost "$PWD/channels/result-rebuild")
          fi
          if [[ "$(jq '.ordinary_recipes | length' "$PLAN_FILE")" != 0 ]]; then
            inputs+=(--input ordinary "$PWD/channels/ordinary")
          fi
          pixi run python scripts/channel-artifact.py merge --plan "$PLAN_FILE" \
            --channel "$PWD/channels/result" "${inputs[@]}"

      - name: Publish affected packages
        env:
          PREFIX_CHANNEL: black-desk
        run: pixi run publish-result

  packages-pass:
    name: packages-pass
    if: always()
    needs: [plan, dirty, result, selfhost, smoke, ordinary]
    runs-on: ubuntu-latest
    steps:
      - name: Check required stages and intentional skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          jobs = json.loads(os.environ["NEEDS_JSON"])
          assert jobs["plan"]["result"] == "success", "Planning failed or was cancelled"
          outputs = jobs["plan"]["outputs"]
          for job in ("dirty", "result", "selfhost", "smoke", "ordinary"):
              if job in ("dirty", "result", "selfhost"):
                  flag = "bootstrap_build_required"
              else:
                  flag = "ordinary_required" if job == "ordinary" else "bootstrap_required"
              assert outputs[flag] in ("true", "false"), f"Invalid plan output: {flag}"
              expected = "success" if outputs[flag] == "true" else "skipped"
              actual = jobs[job]["result"]
              assert actual == expected, f"{job}: expected {expected}, got {actual}"
          PY
