schema_version: 1

context:
  version: "2.5.0"

package:
  name: talloc
  version: ${{ version }}

source:
  - url: https://www.samba.org/ftp/talloc/talloc-2.5.0.tar.gz
    sha256: 912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
  run:
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package talloc
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
        - pkgconf ==3.0.7

about:
  homepage: https://talloc.samba.org/
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: Hierarchical memory allocator
