schema_version: 1

context:
  version: "2.5.0"

package:
  name: talloc
  version: ${{ version }}

source:
  url: https://www.samba.org/ftp/talloc/talloc-2.5.0.tar.gz
  sha256: 912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

requirements:
  build:
    - gcc ==16.2.0
    - binutils >=2.46,<3
    - sysroot_linux-64 ==2.28
    - python >=3.14,<4
    - pkgconf
  run_exports:
    strong:
      - talloc >=2.5.0,<3

tests:
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/
    requirements:
      run:
        - gcc ==16.2.0
        - pkgconf

about:
  homepage: https://talloc.samba.org/
  license: LGPL-3.0-or-later
  license_file: talloc.h
  summary: Hierarchical memory allocator with destructors
