schema_version: 1
context:
  version: "2.15.4"
recipe:
  name: libxml2
  version: ${{ version }}
source:
  - url: https://download.gnome.org/sources/libxml2/2.15/libxml2-${{ version }}.tar.xz
    sha256: 98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../clang
    target_directory: devkit-build
outputs:
  - package:
      name: libxml2
    build:
      number: 1
      string: h${{ hash }}_${{ build_number }}
      dynamic_linking:
        binary_relocation: false
      script:
        file: build.sh
        env:
          DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
          LIBRARY_VERSION: ${{ version }}
          SYSROOT_TRIPLET: ${{ sysroot_triplet }}
    requirements:
      build:
        - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
          then:
            - clang-23 ==23.1.3
            - llvm-tools ==23.1.3
            - lld ==23.1.2
            - libgcc-devel_linux-64 ==16.2.0
          else:
            - clang ==23.1.3
        - pkgconf ==3.0.7
        - make ==4.4.1
        - gnuconfig ==2025.07.09
        - sysroot_linux-64 ==2.28
      host:
        - icu ==78.3
        - libiconv ==1.18
        - zlib ==1.3.2
        - llvm-libgcc ==23.1.3
      run:
        - icu ==78.3
        - libiconv >=1.18,<2
        - zlib >=1.3.2,<1.4
        - llvm-libgcc ==23.1.3
    tests:
      - script:
          - unset LD_LIBRARY_PATH LD_PRELOAD
          - xmllint --version 2>&1 | tee features.txt
          - grep -F ICU features.txt
          - grep -F Zlib features.txt
          - grep -F Schematron features.txt
          - printf '<root>bootstrap</root>\n' > input.xml
          - test "$(xmllint --xpath 'string(/root)' input.xml)" = bootstrap
          - test -f "${PREFIX}/include/libxml2-${{ version }}/libxml/parser.h"
          - readelf -d "${PREFIX}/lib/libxml2.so" | grep -F '(RUNPATH)'

  - package:
      name: libxml2-16
    build:
      number: 1
      string: meta_h${{ hash }}_${{ build_number }}
      noarch: generic
      script: "true"
    requirements:
      run:
        - ${{ pin_subpackage('libxml2', exact=True) }}
    tests:
      - script:
          - test -f "${PREFIX}/lib/libxml2.so.16"

about:
  homepage: https://gitlab.gnome.org/GNOME/libxml2
  license: MIT
  license_file: Copyright
  summary: XML library and tools with ICU, iconv, zlib and Schematron support
