build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    # Preserve auditwheel's relative RPATHs and bundled native libraries.
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - uv ==0.12.22
  host:
    - python ==3.14.8
  run:
    - python ==3.14.8
    - git >=2.56.0,<3
    - __glibc >=2.28

tests:
  - package_contents:
      bin:
        - b4
      files:
        - share/devkit/python-tools/b4/uv-receipt.toml
        - share/devkit/python-tools/b4/pyvenv.cfg
  - script:
      - bash tests/smoke.sh
    requirements:
      run:
        - uv ==0.12.22
    files:
      recipe:
        - tests/smoke.sh
        - tests/runtime.py
        - requirements.lock

about:
  homepage: https://b4.docs.kernel.org/
  license: GPL-2.0-or-later
  license_file: licenses/**
  summary: Tools for working with patches in public-inbox archives
  description: b4 and its pinned Python dependencies installed offline by uv in a private environment, using upstream manylinux wheels for native extensions.
  repository: https://git.kernel.org/pub/scm/utils/b4/b4.git
  documentation: https://b4.docs.kernel.org/
