schema_version: 1
context:
  version: 26.10.1
package:
  name: black
  version: ${{ version }}
source:
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    env:
      TOOL_DISTRIBUTION: black
      TOOL_COMMANDS: black blackd
    file: build.sh
requirements:
  build:
    - uv ==0.12.22
  host:
    - python ==3.14.8
  run:
    - python ==3.14.8
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package black
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - black
        - blackd
      files:
        - lib/devkit/share/devkit/python-tools/black/uv-receipt.toml
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/
        - requirements.lock
about:
  homepage: https://black.readthedocs.io/
  license: MIT
  license_file: licenses/**
  summary: Python code formatter in a private environment
