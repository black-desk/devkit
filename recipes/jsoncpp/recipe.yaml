schema_version: 1
context:
  version: "1.9.8"
package:
  name: jsoncpp
  version: ${{ version }}
source:
  - url: https://github.com/open-source-parsers/jsoncpp/archive/${{ version }}.tar.gz
    sha256: 51828cf3574281d2b79ec2a1c56a9e4c20cc1103711321ea96384cffb8d2d904
    patches:
      - patches/development-install.patch
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 3
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  host:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run_exports:
    strong:
      - jsoncpp >=1.9.8,<2
  run:
    - __glibc >=2.28
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package jsoncpp
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/include/jsoncpp-${{ version }}/json/*.h
        - lib/devkit/lib/libjsoncpp.so
        - lib/libjsoncpp.so.*
        - lib/devkit/lib/libjsoncpp.a
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - ln -s "${PREFIX}/lib" runtime-lib
      - ./library-probe
      - readelf -d "${PREFIX}/lib/devkit/lib/libjsoncpp.so" | grep -F '(RUNPATH)'
    files:
      source:
        - library-probe
about:
  homepage: https://github.com/open-source-parsers/jsoncpp
  license: MIT
  license_file: LICENSE
  summary: C++ JSON reader and writer
