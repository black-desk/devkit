schema_version: 1
context:
  version: 4.1.0
package:
  name: tree-sitter-vimdoc
  version: ${{ version }}
source:
  - url: https://github.com/neovim/tree-sitter-vimdoc/archive/v4.1.0.tar.gz
    sha256: 020e8f117f648c8697fca967995c342e92dbd81dab137a115cc7555207fbc84f
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
  - path: CMakeLists.txt
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - cmake ==3.31.8
    - ninja ==1.13.2
  run:
    - __glibc >=2.28
    - libtree-sitter ==0.26.13
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package tree-sitter-vimdoc
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/lib/nvim/parser/vimdoc.so
  - script:
      - python3 -c "import ctypes as c, os; root=os.environ['PREFIX']+'/lib/devkit/lib/'; runtime=c.CDLL(root+'libtree-sitter.so'); runtime.ts_parser_new.restype=c.c_void_p; parser=runtime.ts_parser_new(); assert(parser); grammar=c.CDLL(root+'nvim/parser/vimdoc.so'); grammar.tree_sitter_vimdoc.restype=c.c_void_p; runtime.ts_parser_set_language.argtypes=[c.c_void_p,c.c_void_p]; assert(runtime.ts_parser_set_language(parser,grammar.tree_sitter_vimdoc())); runtime.ts_parser_delete.argtypes=[c.c_void_p]; runtime.ts_parser_delete(parser)"
about:
  homepage: https://github.com/neovim/tree-sitter-vimdoc
  license: MIT
  license_file:
    - LICENSE
  summary: Tree-sitter vimdoc parser modules
