schema_version: 1
context:
  version: 0.15.2
package:
  name: typstyle
  version: ${{ version }}
source:
  - url: https://codeload.github.com/Enter-tainer/typstyle/tar.gz/refs/tags/v0.15.2
    sha256: 155bf8156a1e8f8c08b0730332a5c77f282e9ff672e0953e1eff1996eff56de3
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
  host:
    - llvm-libgcc ==23.1.3
  run:
    - llvm-libgcc ==23.1.3
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package typstyle
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - typstyle
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/
about:
  homepage: https://github.com/typstyle-rs/typstyle
  repository: https://github.com/typstyle-rs/typstyle
  license: Apache-2.0
  license_file: LICENSE
  summary: Typst source code formatter
