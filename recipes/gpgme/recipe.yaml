schema_version: 1

context:
  version: "1.24.2"

package:
  name: gpgme
  version: ${{ version }}

source:
  - url: https://www.gnupg.org/ftp/gcrypt/gpgme/gpgme-1.24.2.tar.bz2
    sha256: e11b1a0e361777e9e55f48a03d89096e2abf08c63d84b7017cfe1dce06639581
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
  host:
    - libgpg-error ==1.51
    - libassuan ==3.0.2
  run:
    - libgpg-error >=1.51,<2
    - libassuan >=3.0.2,<4
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package gpgme
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
        - pkgconf ==3.0.7

about:
  homepage: https://www.gnupg.org/software/gpgme/
  license: LGPL-2.1-or-later AND GPL-3.0-or-later
  license_file:
    - COPYING
    - COPYING.LESSER
  summary: GnuPG cryptographic engine interface
