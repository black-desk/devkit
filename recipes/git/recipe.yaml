schema_version: 1

context:
  version: "2.56.0"
  openssl_version: "3.5.9"
  curl_version: "8.22.0"
  zlib_version: "1.3.2"
  pcre2_version: "10.49"
  expat_version: "2.8.5"

package:
  name: git
  version: ${{ version }}

source:
  url: https://www.kernel.org/pub/software/scm/git/git-${{ version }}.tar.xz
  sha256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      GIT_VERSION: ${{ version }}
      OPENSSL_VERSION: ${{ openssl_version }}
      CURL_VERSION: ${{ curl_version }}
      ZLIB_VERSION: ${{ zlib_version }}
      PCRE2_VERSION: ${{ pcre2_version }}
      EXPAT_VERSION: ${{ expat_version }}
      SYSROOT_TRIPLET: x86_64-pc-linux-gnu

requirements:
  build:
    - gcc ==16.2.0 meta_hb0f4dca_0
    - binutils ==2.46.1 h8204064_0
    - make ==4.4.1 h8204064_0
    - perl ==5.44.0 hb0f4dca_0
    - pkgconf ==3.0.7 hb0f4dca_0
    - openssl ==3.5.9 hb0f4dca_0
    - curl ==8.22.0 hb0f4dca_0
    - zlib ==1.3.2 hb0f4dca_0
    - pcre2 ==10.49 hb0f4dca_0
    - expat ==2.8.5 hb0f4dca_0
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
    - sysroot_linux-64 ==2.28 h8204064_0
  run:
    - perl >=5.44.0,<6
    - openssl >=3.5.9,<4
    - curl >=8.22.0,<9
    - zlib >=1.3.2,<1.4
    - pcre2 >=10.49,<11
    - expat >=2.8.5,<2.9
    - ca-certificates >=2026.09.25
  run_exports:
    strong:
      - git >=2.56.0,<3

tests:
  - package_contents:
      bin:
        - git
        - scalar
        - git-receive-pack
        - git-shell
        - git-upload-archive
        - git-upload-pack
      files:
        - libexec/git-core/git-send-email
        - libexec/git-core/git-svn
        - libexec/git-core/git-subtree
        - libexec/git-core/git-remote-http
        - libexec/git-core/git-http-fetch
        - libexec/git-core/git-http-push
        - share/perl5/Git.pm
        - share/git-core/templates/hooks/pre-commit.sample

  - script:
      - test "$(command -v git)" = "${PREFIX}/bin/git"
      - test "$(git --version)" = "git version ${{ version }}"
      - >-
        git version --build-options |
        grep -F 'rust: enabled'
      - test "$(git --exec-path)" = "${PREFIX}/libexec/git-core"
      - export GIT_AUTHOR_NAME=devkit
      - export GIT_AUTHOR_EMAIL=devkit@example.invalid
      - export GIT_COMMITTER_NAME=devkit
      - export GIT_COMMITTER_EMAIL=devkit@example.invalid
      - mkdir main-repo
      - git -C main-repo init --quiet --initial-branch=main
      - printf 'main content\n' > main-repo/main.txt
      - git -C main-repo add main.txt
      - git -C main-repo commit --quiet --message='initial main'
      - git -C main-repo grep --perl-regexp -n 'main [[:alpha:]]+' > grep.txt
      - grep -F 'main.txt:1:main content' grep.txt
      - >-
        git -C main-repo worktree add -b second-branch ../main-worktree
        > worktree.txt 2>&1
      - grep -F "new branch 'second-branch'" worktree.txt
      - test -f main-worktree/main.txt
      - git -C main-repo worktree list --porcelain > worktrees.txt
      - grep -Fx "worktree ${PWD}/main-worktree" worktrees.txt
      - mkdir subtree-source
      - git -C subtree-source init --quiet --initial-branch=main
      - printf 'subtree content\n' > subtree-source/subtree.txt
      - git -C subtree-source add subtree.txt
      - git -C subtree-source commit --quiet --message='initial subtree'
      - git -C main-repo subtree add --prefix=subtree ../subtree-source main --squash
      - test -f main-repo/subtree/subtree.txt
      - git -C main-repo subtree split --prefix=subtree --branch=subtree-split
      - git send-email --dump-aliases > send-email.txt
      - >-
        if git http-fetch >http-fetch.txt 2>&1; then exit 1;
        else test "$?" -eq 129; fi
      - git_dependencies="$(ldd "${PREFIX}/libexec/git-core/git-remote-http")"
      - >-
        echo "$git_dependencies" | grep -F 'libcurl.so.4 =>' |
        grep -F "${PREFIX}/"
      - >-
        echo "$git_dependencies" | grep -F 'libssl.so.3 =>' |
        grep -F "${PREFIX}/"
      - >-
        echo "$git_dependencies" | grep -F 'libcrypto.so.3 =>' |
        grep -F "${PREFIX}/"
      - >-
        echo "$git_dependencies" | grep -F 'libz.so.1 =>' |
        grep -F "${PREFIX}/"
      - http_push_dependencies="$(ldd "${PREFIX}/libexec/git-core/git-http-push")"
      - >-
        echo "$http_push_dependencies" | grep -F 'libexpat.so.1 =>' |
        grep -F "${PREFIX}/"

about:
  homepage: https://git-scm.com/
  license: GPL-2.0-only
  license_file: COPYING
  summary: Distributed version control system
  description: Git 2.56 with HTTPS transport, PCRE2, Perl scripts, and contrib/subtree.
  repository: https://github.com/git/git
  documentation: https://git-scm.com/docs
