# Load explicitly with --no-default-config --config=.../share/devkit/clang.cfg.
# CFGDIR is expanded by Clang, so this configuration is relocatable.
--start-no-unused-arguments
--sysroot=<CFGDIR>/../../x86_64-pc-linux-gnu/sysroot
# Do not discover any GCC development installation for channel builds.
--gcc-toolchain=<CFGDIR>/no-gcc
--ld-path=<CFGDIR>/../../bin/ld.lld
--rtlib=compiler-rt
--unwindlib=libunwind
-stdlib=libc++
-nostdinc++
-isystem
<CFGDIR>/../../lib/devkit/include/libcxx-23.1.3/c++/v1
-L<CFGDIR>/../../lib/devkit/lib
-L<CFGDIR>/../../lib/devkit/lib/llvm-runtime
-Wl,-rpath-link,<CFGDIR>/../../lib
-Wl,-rpath-link,<CFGDIR>/../../x86_64-pc-linux-gnu/sysroot/lib64
--end-no-unused-arguments
