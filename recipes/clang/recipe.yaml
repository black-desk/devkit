schema_version: 1

context:
  version: "23.1.3"

package:
  name: clang
  version: ${{ version }}

source:
  - url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ version }}/llvm-project-${{ version }}.src.tar.xz
    sha256: c44186a7762ed28954be72e5ff6df9808e0779d4f1bf014ecc4e7e211d31ee34
    patches:
      - patches/compiler-rt-custom-libcxx-flags.patch
      - patches/llvm-config-development-prefix.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 8
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}

# Seed builds use upstream LLVM tools; later stages use the channel toolchain.
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - sysroot_linux-64 ==2.28
  host:
    - zlib ==1.3.2
    - zstd ==1.5.7
    - libxml2 ==2.15.4
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run:
    - zlib >=1.3.2,<1.4
    - zstd >=1.5.7,<1.6
    - libxml2 ==2.15.4
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package clang
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - clang
        - clang++
        - ld.lld
        - llvm-ar
        - llvm-ranlib
        - llvm-nm
        - llvm-objcopy
        - llvm-strip
        - llvm-readelf
      files:
        - bin/clang.cfg
        - bin/clang++.cfg
        - lib/linux/libclang_rt.asan-x86_64.a
        - lib/linux/libclang_rt.profile-x86_64.a
        - lib/linux/libclang_rt.fuzzer-x86_64.a
        - lib/linux/libclang_rt.xray-x86_64.a
        - lib/linux/liborc_rt-x86_64.a
        - lib/clang/23/include/sanitizer/asan_interface.h
        - share/devkit/clang.cfg
        - share/devkit/finalize-elf.py
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/clang" | grep -F '(RUNPATH)'
      - clang --version
      - ld.lld --version
      - llvm-ar --version
      - test "$(llvm-config --includedir)" = "${PREFIX}/lib/devkit/include"
      - test "$(llvm-config --libdir)" = "${PREFIX}/lib/devkit/lib"
      - test "$(llvm-config --cmakedir)" = "${PREFIX}/lib/devkit/lib/cmake/llvm"
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - >-
        "${PREFIX}/bin/clang++" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" --unwindlib=none -O2 -fPIC
        -fsanitize=address,undefined tests/runtime.cpp -lgcc_s
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o runtime-probe
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" --unwindlib=none -O2 -fPIC
        -fsanitize=address tests/asan-error.c -lgcc_s
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o asan-error-probe
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" --unwindlib=none -O2 -fPIC
        -stdlib=libc++ -fsanitize=fuzzer tests/fuzzer.c -lgcc_s
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o fuzzer-probe
      - >-
        "${PREFIX}/bin/clang++" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" --unwindlib=none -O2 -fPIC
        -fprofile-instr-generate -fcoverage-mapping tests/runtime.cpp -lgcc_s
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o profile-probe
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" --unwindlib=none -O2 -fPIC
        -stdlib=libc++ -fxray-instrument tests/xray.c -lgcc_s
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o xray-probe
      - ./runtime-probe
      - if ./asan-error-probe >asan.log 2>&1; then exit 1; fi
      - grep -F 'AddressSanitizer' asan.log
      - grep -F 'heap-buffer-overflow' asan.log
      - ./fuzzer-probe -runs=10
      - LLVM_PROFILE_FILE="$PWD/default.profraw" ./profile-probe
      - test -s default.profraw
      - ./xray-probe
    files:
      recipe:
        - tests/runtime.cpp
        - tests/asan-error.c
        - tests/fuzzer.c
        - tests/xray.c
    requirements:
      run:
        - sysroot_linux-64 ==2.28
about:
  homepage: https://clang.llvm.org/
  license: Apache-2.0 WITH LLVM-exception
  license_file: llvm/LICENSE.TXT
  summary: Host-integrating Clang with LLVM binary tools and LLD
  repository: https://github.com/llvm/llvm-project
