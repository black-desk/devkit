schema_version: 1
context:
  version: 2.1.1774638290
package:
  name: luajit
  version: ${{ version }}
source:
  - url: https://github.com/luajit/luajit/archive/fbb36bb6bfa88716a47c58bcf9ce9f2ef752abac.tar.gz
    sha256: e60cd2f3057aa39d33d1c895a20087ab54494d9a1ca45aa488ff0378af42df48
    patches:
      - patches/luajit-llvm-unwind.patch
      - patches/relative-modules.patch
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
  run:
    - __glibc >=2.28
    - llvm-libgcc ==23.1.3
  host:
    - llvm-libgcc ==23.1.3
  run_exports:
    strong:
      - luajit ==2.1.1774638290
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package luajit
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD LUA_PATH LUA_CPATH
      - luajit -e "assert(jit.status()); require('jit.opt').start('hotloop=1'); local n=0; for i=1,10000 do n=n+i end; assert(n==50005000); assert(require('jit.util').traceinfo(1))"
about:
  homepage: https://github.com/luajit/luajit
  license: MIT
  license_file:
    - COPYRIGHT
  summary: LuaJIT interpreter and shared Lua 5.1 library
