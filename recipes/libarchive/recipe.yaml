schema_version: 1
context:
  version: "3.8.9"
package:
  name: libarchive
  version: ${{ version }}
source:
  - url: https://github.com/libarchive/libarchive/archive/v${{ version }}.tar.gz
    sha256: 744346f6bca195c8f894f847bb32a16e9bcae6002624a58fadc81e80f595b3cb
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 5
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - pkgconf ==3.0.7
    - sysroot_linux-64 ==2.28
  host:
    - openssl ==3.5.9
    - zlib ==1.3.2
    - bzip2 ==1.0.8
    - liblzma ==5.8.3
    - zstd ==1.5.7
    - libxml2 ==2.15.4
    - libiconv ==1.18
    - lz4-c ==1.10.0
    - lzo ==2.10
  run_exports:
    strong:
      - libarchive >=3.8.9,<4
  run:
    - __glibc >=2.28
    - openssl >=3.5.9,<4
    - zlib >=1.3.2,<2
    - bzip2 >=1.0.8,<2
    - liblzma >=5.8.3,<6
    - zstd >=1.5.7,<2
    - libxml2 >=2.15.4,<3
    - libiconv >=1.18,<2
    - lz4-c >=1.10.0,<2
    - lzo >=2.10,<3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libarchive ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - bsdtar
        - bsdcpio
        - bsdcat
        - bsdunzip
      files:
        - lib/devkit/include/libarchive-${{ version }}/*.h
        - lib/devkit/lib/libarchive.so
        - lib/devkit/lib/libarchive.so.*
        - lib/devkit/lib/libarchive.a
        - lib/devkit/lib/pkgconfig/libarchive.pc
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/lib/devkit/share/devkit/clang.cfg" -O2 -fPIC
        -I"${PREFIX}/lib/devkit/include/libarchive-${{ version }}"
        tests/probe.c "${PREFIX}/lib/devkit/lib/libarchive.so"
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib/devkit/lib" -o library-probe
      - ./library-probe
      - export PKG_CONFIG_LIBDIR="${PREFIX}/lib/devkit/lib/pkgconfig"
      - static_libs="$(pkgconf --static --libs libarchive)"
      - static_libs="${static_libs/-larchive/${PREFIX}/lib/devkit/lib/libarchive.a}"
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/lib/devkit/share/devkit/clang.cfg" -O2
        $(pkgconf --cflags libarchive) tests/probe.c ${static_libs}
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib/devkit/lib" -o static-probe
      - ./static-probe
      - >-
        if readelf -d static-probe | grep -F 'Shared library: [libarchive.so';
        then exit 1; fi
      - bsdtar --version | grep -F libarchive
      - bsdcpio --version
      - bsdcat --version
      - bsdunzip --version
      - readelf -d "${PREFIX}/lib/devkit/lib/libarchive.so" | grep -F '(RUNPATH)'
    files:
      recipe:
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
        - pkgconf ==3.0.7
about:
  homepage: https://www.libarchive.org/
  license: BSD-2-Clause AND GPL-2.0-or-later
  license_file: COPYING
  summary: Archive library and tools with LZO, LZ4 and other channel compression backends
