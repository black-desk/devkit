schema_version: 1

context:
  version: "3.2.7"

package:
  name: gmime
  version: ${{ version }}

source:
  - url: https://download.gnome.org/sources/gmime/3.2/gmime-3.2.7.tar.xz
    sha256: 2aea96647a468ba2160a64e17c6dc6afe674ed9ac86070624a3f584c10737d44
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
  host:
    - glib ==2.84.4
    - gpgme ==1.24.2
    - zlib ==1.3.2
    - libiconv ==1.18
  run:
    - glib >=2.84.4,<3
    - gpgme >=1.24.2,<2
    - zlib >=1.3.2,<2
    - libiconv >=1.18,<2
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package gmime
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
        - pkgconf ==3.0.7

about:
  homepage: https://github.com/jstedfast/gmime
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: MIME message creation and parsing library
