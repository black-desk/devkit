schema_version: 1

context:
  version: "0.12.22"

package:
  name: uv
  version: ${{ version }}

source:
  - url: https://github.com/astral-sh/uv/archive/refs/tags/${{ version }}.tar.gz
    sha256: 056ef9a33d6812a51153799ce5b35b08f02f4f37b32a26d22e99245a1f16b77c
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 4
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - clang ==23.1.3
    - make ==4.4.1
    - sysroot_linux-64 ==2.28
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
  host:
    - llvm-libgcc ==23.1.3
  run:
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package uv ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - uv
        - uvx
      files:
        - lib/devkit/share/bash-completion/completions/uv
        - lib/devkit/share/bash-completion/completions/uvx
        - lib/devkit/share/fish/vendor_completions.d/uv.fish
        - lib/devkit/share/fish/vendor_completions.d/uvx.fish
        - lib/devkit/share/zsh/site-functions/_uv
        - lib/devkit/share/zsh/site-functions/_uvx

  - script:
      - test "$(uv --version | cut -d ' ' -f 1,2)" = "uv ${{ version }}"
      - test "$(uvx --version | cut -d ' ' -f 1,2)" = "uvx ${{ version }}"
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/

  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/uv" | grep -F "(RUNPATH)"
      - ldd "${PREFIX}/bin/uv" | grep -F "libgcc_s.so.1 =>" | grep -F "${PREFIX}/"
      - readelf -d "${PREFIX}/bin/uvx" | grep -F "(RUNPATH)"
      - ldd "${PREFIX}/bin/uvx" | grep -F "libgcc_s.so.1 =>" | grep -F "${PREFIX}/"
about:
  homepage: https://docs.astral.sh/uv/
  license: Apache-2.0 OR MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
  summary: A fast Python package and project manager written in Rust
  description: Python package, tool, and interpreter management built with the devkit-selected Rust toolchain, without self-update.
  repository: https://github.com/astral-sh/uv
  documentation: https://docs.astral.sh/uv/
