schema_version: 1
context:
  version: 0.1.11
package:
  name: cmake-language-server
  version: ${{ version }}
source:
  - url: https://files.pythonhosted.org/packages/source/c/cmake-language-server/cmake_language_server-0.1.11.tar.gz
    sha256: 005f48367ec569457a7229a58f6762044fddacac647858b39d725ae2b3cd695b
    target_directory: tool-source
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    env:
      TOOL_DISTRIBUTION: cmake-language-server
      TOOL_COMMANDS: cmake-language-server
    file: build.sh
requirements:
  build:
    - uv ==0.12.22
  host:
    - python ==3.14.8
  run:
    - python ==3.14.8
    - __glibc >=2.28
    - cmake ==3.31.8
    - cmake-format ==0.6.13
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package cmake-language-server
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - cmake-language-server
      files:
        - lib/devkit/share/devkit/python-tools/cmake-language-server/uv-receipt.toml
  - script:
      - cmake-language-server --help
about:
  homepage: https://github.com/regen100/cmake-language-server
  license: MIT
  license_file: licenses/**
  summary: CMake language server in a private environment
