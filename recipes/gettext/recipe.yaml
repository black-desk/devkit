schema_version: 1
context:
  version: "0.25.1"
recipe:
  name: gettext
  version: ${{ version }}
source:
  - url: https://ftp.gnu.org/gnu/gettext/gettext-${{ version }}.tar.xz
    sha256: 2c8294be238f03fb3fa65b8051057e5b68167f3e21f08008070cf40a7051ba22
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

outputs:
  - package:
      name: gettext
    build:
      number: 3
      string: h${{ hash }}_${{ build_number }}
      dynamic_linking:
        binary_relocation: false
      script:
        file: build.sh
        env:
          DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
          LIBRARY_VERSION: ${{ version }}
          SYSROOT_TRIPLET: ${{ sysroot_triplet }}
    requirements:
      build:
        - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
          then:
            - clang-23 ==23.1.3
            - llvm-tools ==23.1.3
            - lld ==23.1.2
            - libgcc-devel_linux-64 ==16.2.0
          else:
            - clang ==23.1.3
        - make ==4.4.1
        - pkgconf ==3.0.7
        - gnuconfig ==2025.07.09
        - sysroot_linux-64 ==2.28
      host:
        - libiconv ==1.18
        - ncurses ==6.6
        - libcxx ==23.1.3
        - llvm-libgcc ==23.1.3
      run_exports:
        strong:
          - gettext >=0.25.1,<0.26
      run:
        - __glibc >=2.28
        - libiconv ==1.18
        - ncurses ==6.6
        - libcxx ==23.1.3
        - llvm-libgcc ==23.1.3
    tests:
      - script:
          - python3 devkit-build/check-package.py "${PREFIX}" --package gettext
        files:
          source:
            - devkit-build/check-package.py
      - package_contents:
          bin:
            - msgfmt
            - msgunfmt
            - msgmerge
            - xgettext
            - gettext
            - ngettext
          files:
            - lib/devkit/include/gettext-${{ version }}/gettext-po.h
            - lib/devkit/lib/libgettextpo.so
            - lib/devkit/lib/libasprintf.so
            - lib/devkit/lib/libtextstyle.so
      - script:
          - unset LD_LIBRARY_PATH LD_PRELOAD
          - msgfmt --version | grep -F '0.25.1'
          - msgfmt --check -o messages.mo tests/messages.po
          - msgunfmt messages.mo > restored.po
          - grep -F 'bonjour' restored.po
          - readelf -d "${PREFIX}/bin/msgfmt" | grep -F '(RUNPATH)'
        files:
          recipe:
            - tests/
  - package:
      name: gettext-tools
    build:
      number: 3
      string: meta_h${{ hash }}_${{ build_number }}
      noarch: generic
      script: "true"
    requirements:
      run:
        - ${{ pin_subpackage("gettext", exact=True) }}
    tests:
      - script:
          - msgfmt --version | grep -F '0.25.1'

about:
  homepage: https://www.gnu.org/software/gettext/
  license: LGPL-2.1-or-later AND GPL-3.0-or-later
  license_file: COPYING
  summary: Translation tools and libraries including msgfmt
