schema_version: 1
context:
  version: "1.65.0"
package:
  name: cppdap
  version: ${{ version }}
source:
  - url: https://github.com/google/cppdap/archive/c69444ed76f7468b232ac4f989cb8f2bdc100185.tar.gz
    sha256: f73953fe9c9557b6ce893a3ee90bbde5919c96e4f3603d67cdf8ed49da714529
    patches:
      - patches/jsoncpp-config-dependency.patch
      - patches/shared-library-version.patch
  # Test-only source; not installed or a channel runtime dependency.
  - url: https://github.com/google/googletest/archive/refs/tags/release-1.12.1.tar.gz
    sha256: 81964fe578e9bd7c94dfdb09c8e4d6e6759e19967e397dbea48d1c10e45d0df2
    target_directory: test-googletest
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 5
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  host:
    - jsoncpp ==1.9.8
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run_exports:
    strong:
      - cppdap >=1.65.0,<1.66
  run:
    - jsoncpp >=1.9.8,<2
    - __glibc >=2.28
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package cppdap
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/include/cppdap-${{ version }}/dap/*.h
        - lib/devkit/lib/libcppdap.so
        - lib/libcppdap.so.*
        - lib/devkit/lib/libcppdap.a
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - >-
        "${PREFIX}/bin/clang++" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" --unwindlib=none -O2 -fPIC
        -I"${PREFIX}/lib/devkit/include/cppdap-${{ version }}"
        tests/probe.cpp "${PREFIX}/lib/devkit/lib/libcppdap.so" -pthread -lgcc_s
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o library-probe
      - ./library-probe
      - readelf -d "${PREFIX}/lib/devkit/lib/libcppdap.so" | grep -F '(RUNPATH)'
    files:
      recipe:
        - tests/probe.cpp
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
about:
  homepage: https://github.com/google/cppdap
  license: Apache-2.0
  license_file: LICENSE
  summary: C++ Debug Adapter Protocol implementation
