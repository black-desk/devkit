schema_version: 1

context:
  version: "2.84.4"

package:
  name: glib
  version: ${{ version }}

source:
  - url: https://download.gnome.org/sources/glib/2.84/glib-2.84.4.tar.xz
    sha256: 8a9ea10943c36fc117e253f80c91e477b673525ae45762942858aef57631bb90
    patches:
      - patches/gdb-autoload-dir.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
    - ninja ==1.13.2
  host:
    - python ==3.14.8
    - libffi ==3.4.8
    - pcre2 ==10.49
    - zlib ==1.3.2
  run:
    - libffi >=3.4.8,<4
    - pcre2 >=10.49,<11
    - zlib >=1.3.2,<2
    - python ==3.14.8
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package glib
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
        - pkgconf ==3.0.7

about:
  homepage: https://docs.gtk.org/glib/
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: GLib GObject and GIO application libraries
