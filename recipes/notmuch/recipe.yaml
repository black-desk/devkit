schema_version: 1

context:
  version: "0.39"

package:
  name: notmuch
  version: ${{ version }}

source:
  - url: https://notmuchmail.org/releases/notmuch-0.39.tar.xz
    sha256: b88bb02a76c46bad8d313fd2bb4f8e39298b51f66fcbeb304d9f80c3eef704e3
    patches:
      - patches/configure-gmime-ldflags.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
  host:
    - xapian ==1.4.32
    - gmime ==3.2.7
    - talloc ==2.5.0
    - zlib ==1.3.2
  run:
    - xapian >=1.4.32,<1.5
    - gmime >=3.2.7,<4
    - talloc >=2.5.0,<3
    - zlib >=1.3.2,<2
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package notmuch
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh

about:
  homepage: https://notmuchmail.org/
  license: GPL-3.0-or-later
  license_file:
    - COPYING
    - COPYING-GPL-3
  summary: Mail indexer with fast full-text search and tags
