build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
    - uv ==0.12.22
  host:
    - python ==3.14.8
    - notmuch ==0.39
  run:
    - python ==3.14.8
    - notmuch >=0.39,<0.40
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package lieer --skip-runpath-check
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh
        - tests/runtime.py

about:
  homepage: https://github.com/gauteh/lieer
  license: GPL-3.0-or-later
  license_file: licenses/**
  summary: Gmail synchronization for notmuch in an offline locked private Python environment
