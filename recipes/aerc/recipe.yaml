schema_version: 1

context:
  version: "0.21.0"

package:
  name: aerc
  version: ${{ version }}

source:
  - url: https://git.sr.ht/~rjarry/aerc/archive/0.21.0.tar.gz
    sha256: 3f1469bbaea982fc58352f2682932ecc2fb50c705994d96b2343e771747745a7
    patches:
      - patches/relative-resource-dirs.patch
      - patches/desktop-install-dir.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
    - go ==1.27.1
    - scdoc ==1.11.3
  host:
    - notmuch ==0.39
  run:
    - python ==3.14.8
    - notmuch >=0.39,<0.40
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package aerc
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh

about:
  homepage: https://aerc-mail.org/
  license: MIT
  license_file: LICENSE
  summary: Terminal mail client with IMAP JMAP Maildir and notmuch support
