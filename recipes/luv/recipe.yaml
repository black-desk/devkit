schema_version: 1
context:
  version: 1.52.1
package:
  name: luv
  version: ${{ version }}
source:
  - url: https://github.com/luvit/luv/archive/1.52.1-0.tar.gz
    sha256: e8b8774b31d24be4fcf2b021b90599ecccc8e476c61efcc59c3c10cab813a885
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - cmake ==3.31.8
    - ninja ==1.13.2
  run:
    - __glibc >=2.28
    - llvm-libgcc ==23.1.3
    - luajit ==2.1.1774638290
    - libuv ==1.52.1
  host:
    - luajit ==2.1.1774638290
    - libuv ==1.52.1
    - lua-compat-5.3 ==0.13
  run_exports:
    strong:
      - luv ==1.52.1
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package luv
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD LUA_PATH LUA_CPATH
      - luajit -e "local uv=require('luv'); local done=false; local t=uv.new_timer(); t:start(1,0,function() done=true; t:close() end); uv.run(); assert(done)"
    requirements:
      run:
        - luajit ==2.1.1774638290
about:
  homepage: https://github.com/luvit/luv
  license: Apache-2.0
  license_file:
    - LICENSE.txt
  summary: Lua bindings for libuv
