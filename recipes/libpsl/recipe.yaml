schema_version: 1
context:
  version: "0.23.1"
package:
  name: libpsl
  version: ${{ version }}
source:
  - url: https://github.com/rockdaboot/libpsl/releases/download/${{ version }}/libpsl-${{ version }}.tar.gz
    sha256: 8fbb03054556498ba9c4cc48fcaa36a4483748c6504a65bdb9ba348f555b0e56
    patches:
      - patches/development-install.patch
      - patches/clang-driver-link-policy.patch
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 3
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - pkgconf ==3.0.7
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  host:
    - icu ==78.3
  run_exports:
    strong:
      - libpsl >=0.23.1,<0.24
  run:
    - __glibc >=2.28
    - icu ==78.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libpsl
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/include/libpsl-${{ version }}/*.h
        - lib/devkit/lib/libpsl.so
        - lib/libpsl.so.*
        - lib/devkit/lib/pkgconfig/libpsl.pc
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" -O2 -fPIC
        -I"${PREFIX}/lib/devkit/include/libpsl-${{ version }}"
        tests/probe.c "${PREFIX}/lib/devkit/lib/libpsl.so"
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o library-probe
      - ./library-probe
      - readelf -d "${PREFIX}/lib/devkit/lib/libpsl.so" | grep -F '(RUNPATH)'
    files:
      recipe:
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
about:
  homepage: https://github.com/rockdaboot/libpsl
  license: MIT
  license_file: LICENSE
  summary: Public suffix library with ICU and built-in suffix data
