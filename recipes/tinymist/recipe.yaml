schema_version: 1
context:
  version: 0.15.10
package:
  name: tinymist
  version: ${{ version }}
source:
  - url: https://codeload.github.com/Myriad-Dreamin/tinymist/tar.gz/refs/tags/v0.15.10
    sha256: c6ecb0b8a772148fc4864c87b46f9d9d07ad6e6e19ab2ac0f84f2a873c775f1b
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
    - pkgconf ==3.0.7
  host:
    - llvm-libgcc ==23.1.3
    - openssl ==3.5.9
  run:
    - llvm-libgcc ==23.1.3
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package tinymist
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - tinymist
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/
about:
  homepage: https://github.com/Myriad-Dreamin/tinymist
  repository: https://github.com/Myriad-Dreamin/tinymist
  license: Apache-2.0
  license_file: LICENSE
  summary: Integrated Typst language service with preview and export
