schema_version: 1

context:
  version: "0.6.0"

package:
  name: pynvim
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/54/2d/c28b9293975ed9ee05e52f1d316cb402ba6edb232baa0497754a70182ca2/pynvim-0.6.0-py3-none-any.whl
    sha256: 29f92ff3fde9e52c263e6bfd7f30345be05bfc7b5c21484da1cc38a8d8e5e98f
    file_name: pynvim-0.6.0-py3-none-any.whl
    target_directory: artifacts
  - url: https://files.pythonhosted.org/packages/3e/6e/0091f175ccd02b02bc8811bbcbcc6ac2e980be116e3b2f7a736ca322bf84/greenlet-3.5.6.tar.gz
    sha256: 8e67c43bdfc88d5fee6db0d3e40175b362fc95fb85f0412d233b9b203c53a575
    file_name: greenlet-3.5.6.tar.gz
    target_directory: artifacts
  - url: https://files.pythonhosted.org/packages/0a/e7/bb605a7bab2d8425a64b3fa762b39dc1bf1c7e3f11ba6fb5413d6db0ff8c/msgpack-1.2.3.tar.gz
    sha256: 32edb81a2b5eb7cd7c9d941b2bfbbb082fd2cd09e0e725930316af6b708db186
    file_name: msgpack-1.2.3.tar.gz
    target_directory: artifacts
  - url: https://files.pythonhosted.org/packages/ef/55/6dc6d6bb953bdfc52519a0059592c52b6e3b8ad51cf8256dffceb55b0610/setuptools-84.2.1-py3-none-any.whl
    sha256: ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2
    file_name: setuptools-84.2.1-py3-none-any.whl
    target_directory: artifacts
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - python ==3.14.8
    - uv ==0.12.22
  host:
    - python ==3.14.8
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run:
    - python ==3.14.8
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package pynvim
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - pynvim-python
      files:
        - lib/devkit/share/devkit/python-tools/pynvim/uv-receipt.toml
        - lib/devkit/share/devkit/python-tools/pynvim/lib/python3.14/site-packages/pynvim/__init__.py
  - script:
      - bash tests/smoke.sh
    requirements:
      run:
        - neovim >=0.12.6,<0.13
    files:
      recipe:
        - tests/

about:
  homepage: https://github.com/neovim/pynvim
  license: Apache-2.0
  license_file: licenses/**
  summary: Python client and remote-plugin provider for Neovim
  description: Pynvim in a private Python environment, with source-built greenlet and MessagePack extensions and the upstream pynvim-python discovery command.
  repository: https://github.com/neovim/pynvim
  documentation: https://pynvim.readthedocs.io/
