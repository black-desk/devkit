schema_version: 1

context:
  version: "3.8.0"

package:
  name: libffi
  version: ${{ version }}

source:
  url: https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz
  sha256: 7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

requirements:
  build:
    - gcc ==16.2.0
    - binutils >=2.46,<3
    - sysroot_linux-64 ==2.28
    - make
    - gnuconfig
  run_exports:
    strong:
      - libffi >=3.8.0,<4

tests:
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/
    requirements:
      run:
        - gcc ==16.2.0
        - pkgconf

about:
  homepage: https://sourceware.org/libffi/
  license: MIT
  license_file: LICENSE
  summary: Portable foreign function interface library
