schema_version: 1

context:
  version: "3.4.8"

package:
  name: libffi
  version: ${{ version }}

source:
  - url: https://github.com/libffi/libffi/releases/download/v3.4.8/libffi-3.4.8.tar.gz
    sha256: bc9842a18898bfacb0ed1252c4febcc7e78fa139fd27fdc7a3e30d9d9356119b
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
  run:
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libffi
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
        - pkgconf ==3.0.7

about:
  homepage: https://sourceware.org/libffi/
  license: MIT
  license_file: LICENSE
  summary: Portable foreign function interface library
