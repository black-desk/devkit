schema_version: 1
context:
  version: 2.11.3
package:
  name: libutf8proc
  version: ${{ version }}
source:
  - url: https://github.com/juliastrings/utf8proc/archive/v2.11.3.tar.gz
    sha256: abfed50b6d4da51345713661370290f4f4747263ee73dc90356299dfc7990c78
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - cmake ==3.31.8
    - ninja ==1.13.2
  run:
    - __glibc >=2.28
    - llvm-libgcc ==23.1.3
  run_exports:
    strong:
      - libutf8proc ==2.11.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libutf8proc
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - python3 -c "import ctypes, os; lib=ctypes.CDLL(os.environ['PREFIX']+'/lib/devkit/lib/libutf8proc.so'); lib.utf8proc_version.restype=ctypes.c_char_p; assert(lib.utf8proc_version()==b'2.11.3')"
about:
  homepage: https://github.com/juliastrings/utf8proc
  license: MIT AND Unicode-DFS-2016
  license_file:
    - LICENSE.md
  summary: Unicode processing library
