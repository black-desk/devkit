schema_version: 1

context:
  version: "0.71.0"

package:
  name: difftastic
  version: ${{ version }}

source:
  - url: https://github.com/Wilfred/difftastic/archive/refs/tags/${{ version }}.tar.gz
    sha256: d6afd26103c6492a91307dc6779c7dd0ca4d4c85499f81d7dc53fdfa5107331d
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 3
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - clang ==23.1.3
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
    - sysroot_linux-64 ==2.28
  host:
    - llvm-libgcc ==23.1.3
  run:
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package difftastic ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - difft
      files:
        - lib/devkit/share/man/man1/difft.1

  - script:
      - difft --version > version.txt
      - test "$(head -n 1 version.txt)" = "Difftastic ${{ version }}"
      - 'grep -Fx "Toolchain: 1.98.1" version.txt'
      - difft --color never --syntax-highlight off tests/old.rs tests/new.rs > diff.txt
      - grep -F 'foo()' diff.txt
      - grep -F 'bar()' diff.txt
      - test -s "${PREFIX}/lib/devkit/share/man/man1/difft.1"
    files:
      recipe:
        - tests/

  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/difft" | grep -F "(RUNPATH)"
      - ldd "${PREFIX}/bin/difft" | grep -F "libgcc_s.so.1 =>" | grep -F "${PREFIX}/"
about:
  homepage: https://difftastic.wilfred.me.uk/
  license: MIT
  license_file: LICENSE
  summary: A structural diff that understands syntax
  description: A syntax-aware diff tool built with tree-sitter and the devkit-selected Rust toolchain.
  repository: https://github.com/Wilfred/difftastic
  documentation: https://difftastic.wilfred.me.uk/
