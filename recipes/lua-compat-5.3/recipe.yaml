schema_version: 1
context:
  version: "0.13"
package:
  name: lua-compat-5.3
  version: ${{ version }}
source:
  - url: https://github.com/lunarmodules/lua-compat-5.3/archive/v0.13.tar.gz
    sha256: f5dc30e7b1fda856ee4d392be457642c1f0c259264a9b9bfbcb680302ce88fc2
build:
  number: 0
