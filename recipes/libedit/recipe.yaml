schema_version: 1
context:
  version: "3.1.20260512"
package:
  name: libedit
  version: ${{ version }}
source:
  - url: https://thrysoee.dk/editline/libedit-20260512-3.1.tar.gz
    sha256: 432d5e7ea8b0116dd39f2eca7bc11d0eed77faa6b77ea526ace89907c23ea4a0
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../clang
    target_directory: devkit-build
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  host:
    - ncurses ==6.6
  run_exports:
    strong:
      - libedit >=3.1.20260512,<3.2
  run:
    - __glibc >=2.28
    - ncurses ==6.6
tests:
  - package_contents:
      files:
        - lib/devkit/include/libedit-${{ version }}/*.h
        - lib/devkit/lib/libedit.so
        - lib/libedit.so.*
        - lib/devkit/lib/pkgconfig/libedit.pc
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - ln -s "${PREFIX}/lib" runtime-lib
      - ./library-probe
      - readelf -d "${PREFIX}/lib/devkit/lib/libedit.so" | grep -F '(RUNPATH)'
    files:
      source:
        - library-probe
about:
  homepage: https://thrysoee.dk/editline/
  license: BSD-2-Clause
  license_file: COPYING
  summary: Line editing, history and tokenization library
