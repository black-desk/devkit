schema_version: 1
context:
  version: 0.6.13
package:
  name: cmake-format
  version: ${{ version }}
source:
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    env:
      TOOL_DISTRIBUTION: cmakelang
      TOOL_COMMANDS: cmake-format cmake-lint cmake-annotate cmake-genparsers ctest-to
    file: build.sh
requirements:
  build:
    - uv ==0.12.22
  host:
    - python ==3.14.8
  run:
    - python ==3.14.8
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package cmake-format
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - cmake-format
        - cmake-lint
        - cmake-annotate
        - cmake-genparsers
        - ctest-to
      files:
        - lib/devkit/share/devkit/python-tools/cmakelang/uv-receipt.toml
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/
        - requirements.lock
about:
  homepage: https://cmake-format.readthedocs.io/
  license: GPL-3.0-only
  license_file: licenses/**
  summary: CMake formatting, linting and annotation tools in a private environment
