schema_version: 1

context:
  version: "1.3.2"

recipe:
  name: zlib
  version: ${{ version }}

source:
  - url: https://github.com/madler/zlib/releases/download/v${{ version }}/zlib-${{ version }}.tar.xz
    sha256: d7a0654783a4da529d1bb793b7ad9c3318020af77667bcae35f95d0e42a792f3
    patches:
      - patches/development-install.patch
      - patches/cmake-test-fixture.patch

  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

outputs:
  - package:
      name: zlib
    build:
      number: 6
      string: h${{ hash }}_${{ build_number }}
      script:
        file: build.sh
        env:
          DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
          ZLIB_VERSION: ${{ version }}
          SYSROOT_TRIPLET: ${{ sysroot_triplet }}

      dynamic_linking:
        binary_relocation: false
    requirements:
      build:
        - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
          then:
            - clang-23 ==23.1.3
            - llvm-tools ==23.1.3
            - lld ==23.1.2
            - libgcc-devel_linux-64 ==16.2.0
          else:
            - clang ==23.1.3
        - cmake ==3.31.8
        - ninja ==1.13.2
        - sysroot_linux-64 ==2.28
      run_exports:
        strong:
          - zlib >=1.3.2,<1.4

    tests:
      - script:
          - python3 devkit-build/check-package.py "${PREFIX}" --package zlib
        files:
          source:
            - devkit-build/check-package.py
      - package_contents:
          files:
            - lib/devkit/include/zlib-${{ version }}/zlib.h
            - lib/devkit/include/zlib-${{ version }}/zconf.h
            - lib/devkit/lib/libz.so
            - lib/libz.so.1
            - lib/libz.so.1.3.2
            - lib/devkit/lib/libz.a
            - lib/devkit/lib/pkgconfig/zlib.pc
            - lib/devkit/lib/cmake/zlib/ZLIBConfig.cmake
            - lib/devkit/lib/cmake/zlib/ZLIBConfigVersion.cmake

      - script:
          - export PKG_CONFIG_LIBDIR="${PREFIX}/lib/devkit/lib/pkgconfig"
          - unset PKG_CONFIG_PATH
          - test "$(command -v pkgconf)" = "${PREFIX}/bin/pkgconf"
          - pc_path="$("${PREFIX}/bin/pkgconf" --path zlib)"
          - cflags="$("${PREFIX}/bin/pkgconf" --cflags zlib)"
          - cflags="${cflags% }"
          - test "$cflags" = "-I$(dirname "$pc_path")/../../include/zlib-${{ version }}"
          - libs="$("${PREFIX}/bin/pkgconf" --libs zlib)"
          - libs="${libs% }"
          - test "$libs" = "$(dirname "$pc_path")/../../lib/libz.so"
          - >-
            test "$("${PREFIX}/bin/pkgconf" --modversion zlib)" = "${{ version
            }}"
          - test ! -e "${PREFIX}/include/zlib.h"
          - test ! -e "${PREFIX}/lib/libz.so"
          - test ! -e "${PREFIX}/lib/libz.a"
        requirements:
          run:
            - pkgconf ==3.0.7

  - package:
      name: libzlib
    build:
      number: 6
      string: meta_h${{ hash }}_${{ build_number }}
      noarch: generic
      script: "true"
    requirements:
      run:
        - ${{ pin_subpackage("zlib", exact=True) }}
    tests:
      - script:
          - test -f "${PREFIX}/lib/libz.so.1"

about:
  homepage: https://zlib.net/
  license: Zlib
  license_file: LICENSE
  summary: General-purpose lossless compression library
  description: The canonical zlib compression library built with the devkit compiler toolchain.
  repository: https://github.com/madler/zlib
  documentation: https://zlib.net/manual.html
