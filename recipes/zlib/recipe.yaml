schema_version: 1

context:
  version: "1.3.2"

package:
  name: zlib
  version: ${{ version }}

source:
  url: https://github.com/madler/zlib/releases/download/v${{ version }}/zlib-${{ version }}.tar.xz
  sha256: d7a0654783a4da529d1bb793b7ad9c3318020af77667bcae35f95d0e42a792f3

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      ZLIB_VERSION: ${{ version }}
      SYSROOT_TRIPLET: x86_64-pc-linux-gnu

requirements:
  build:
    - gcc ==16.2.0 meta_hb0f4dca_0
    - binutils ==2.46.1 h8204064_0
    - make ==4.4.1 h8204064_0
    - sysroot_linux-64 ==2.28 h8204064_0
  run_exports:
    strong:
      - zlib >=1.3.2,<1.4

tests:
  - package_contents:
      files:
        - include/zlib-${{ version }}/zlib.h
        - include/zlib-${{ version }}/zconf.h
        - lib/libz.so
        - lib/libz.so.1
        - lib/libz.so.1.3.2
        - lib/libz.a
        - lib/pkgconfig/zlib.pc

  - script:
      - export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"
      - test "$(command -v pkg-config)" = "${PREFIX}/bin/pkg-config"
      - pc_path="$("${PREFIX}/bin/pkg-config" --path zlib)"
      - cflags="$("${PREFIX}/bin/pkg-config" --cflags zlib)"
      - cflags="${cflags% }"
      - test "$cflags" = "-I$(dirname "$pc_path")/../../include/zlib-${{ version }}"
      - libs="$("${PREFIX}/bin/pkg-config" --libs zlib)"
      - libs="${libs% }"
      - test "$libs" = "$(dirname "$pc_path")/../../lib/libz.so"
      - >-
        test "$("${PREFIX}/bin/pkg-config" --modversion zlib)" = "${{ version
        }}"
      - test ! -e "${PREFIX}/include/zlib.h"
    requirements:
      run:
        - pkgconf ==3.0.7 hb0f4dca_0

about:
  homepage: https://zlib.net/
  license: Zlib
  license_file: LICENSE
  summary: General-purpose lossless compression library
  description: The canonical zlib compression library built with the devkit compiler toolchain.
  repository: https://github.com/madler/zlib
  documentation: https://zlib.net/manual.html
