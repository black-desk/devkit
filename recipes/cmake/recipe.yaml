schema_version: 1

context:
  version: "3.31.8"
  openssl_version: "3.5.9"

package:
  name: cmake
  version: ${{ version }}

source:
  - url: https://github.com/Kitware/CMake/releases/download/v${{ version }}/cmake-${{ version }}.tar.gz
    sha256: e3cde3ca83dc2d3212105326b8f1b565116be808394384007e7ef1c253af6caa
    patches:
      - patches/bootstrap-exclude-ghs-generator.patch
      - patches/curl-long-proxy-type.patch
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 5
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      CMAKE_VERSION: ${{ version }}
      OPENSSL_VERSION: ${{ openssl_version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - openssl ==3.5.9
    - pkgconf ==3.0.7
    - sysroot_linux-64 ==2.28
  run:
    - openssl >=3.5.9,<4
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  host:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
    - openssl ==3.5.9
    - curl ==8.22.0
    - expat ==2.8.5
    - libarchive ==3.8.9
    - jsoncpp ==1.9.8
    - cppdap ==1.65.0
    - libuv ==1.52.1
    - rhash ==1.4.6
    - ncurses ==6.6
    - zlib ==1.3.2
    - bzip2 ==1.0.8
    - zstd ==1.5.7
    - liblzma ==5.8.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package cmake
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - cmake
        - cpack
        - ctest
        - ccmake
      files:
        - doc/cmake-3.31/Copyright.txt

  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - test "$(command -v cmake)" = "${PREFIX}/bin/cmake"
      - bash tests/discovery.sh
      - test "$("${PREFIX}/bin/cmake" --version | head -n 1)" = "cmake version ${{ version }}"
      - test "$("${PREFIX}/bin/ctest" --version | head -n 1)" = "ctest version ${{ version }}"
      - test "$("${PREFIX}/bin/cpack" --version | head -n 1)" = "cpack version ${{ version }}"
      - test "$("${PREFIX}/bin/ccmake" --version | head -n 1)" = "ccmake version ${{ version }}"
      - SYSROOT="${PREFIX}/x86_64-pc-linux-gnu/sysroot"
      - test -d "${SYSROOT}"
      - >-
        "${PREFIX}/bin/cmake" -S tests -B "${PWD}/build" -G "Unix Makefiles" -D CMAKE_C_COMPILER="${PREFIX}/bin/clang" -D CMAKE_CXX_COMPILER="${PREFIX}/bin/clang++" -D CMAKE_C_FLAGS="--no-default-config --config=${PREFIX}/share/devkit/clang.cfg --sysroot=${SYSROOT} -O2" -D CMAKE_CXX_FLAGS="--no-default-config --config=${PREFIX}/share/devkit/clang.cfg --sysroot=${SYSROOT} -O2" -D CMAKE_EXE_LINKER_FLAGS="--sysroot=${SYSROOT} -Wl,-rpath,${PREFIX}/lib -Wl,-rpath-link,${SYSROOT}/lib64" -D CMAKE_BUILD_TYPE=Release
      - >-
        "${PREFIX}/bin/cmake" --build "${PWD}/build" --parallel "${CPU_COUNT}"
      - test "$(${PWD}/build/devkit-cmake-test)" = "hello-cmake"
      - >-
        "${PREFIX}/bin/ctest" --test-dir "${PWD}/build" --output-on-failure
      - cmake_dependencies="$(ldd "${PREFIX}/bin/cmake")"
      - >-
        echo "$cmake_dependencies" | grep -F 'libssl.so.3 =>' | grep -F "${PREFIX}/"
      - >-
        echo "$cmake_dependencies" | grep -F 'libcrypto.so.3 =>' | grep -F "${PREFIX}/"
      - >-
        echo "$cmake_dependencies" | grep -F 'libc++.so.1 =>' | grep -F "${PREFIX}/"
      - >-
        for soname in libcurl.so libarchive.so libjsoncpp.so libcppdap.so libexpat.so libuv.so librhash.so; do echo "$cmake_dependencies" | grep -F "$soname" | grep -F "${PREFIX}/"; done
      - >-
        ldd "${PREFIX}/bin/ccmake" | grep -F 'libncurses.so' | grep -F "${PREFIX}/"
      - >-
        ! echo "$cmake_dependencies" | grep -F 'libstdc++'

    requirements:
      run:
        - make ==4.4.1
        - sysroot_linux-64 ==2.28
        - clang ==23.1.3
    files:
      recipe:
        - tests/

about:
  homepage: https://cmake.org/
  license: BSD-3-Clause
  license_file: Copyright.txt
  summary: Cross-platform build system generator
  description: The CMake build system generator built with the devkit compiler toolchain.
  repository: https://gitlab.kitware.com/cmake/cmake
  documentation: https://cmake.org/cmake/help/latest/
