schema_version: 1
context:
  version: "5.8.3"
package:
  name: liblzma
  version: ${{ version }}
source:
  - url: https://github.com/tukaani-project/xz/releases/download/v${{ version }}/xz-${{ version }}.tar.gz
    sha256: 3d3a1b973af218114f4f889bbaa2f4c037deaae0c8e815eec381c3d546b974a0
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../clang
    target_directory: devkit-build
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  host:
    - llvm-libgcc ==23.1.3
  run:
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - test -f "${PREFIX}/lib/devkit/include/liblzma-5.8.3/lzma.h"
      - test -f "${PREFIX}/lib/devkit/lib/liblzma.so"
      - readelf -d "${PREFIX}/lib/devkit/lib/liblzma.so" | grep -F '(RUNPATH)'
about:
  homepage: https://tukaani.org/xz/
  license: 0BSD
  license_file: COPYING.0BSD
  summary: XZ and LZMA compression library
