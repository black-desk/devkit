schema_version: 1

context:
  version: "23.1.3"

recipe:
  name: clang-tools
  version: ${{ version }}

source:
  - url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ version }}/llvm-project-${{ version }}.src.tar.xz
    sha256: c44186a7762ed28954be72e5ff6df9808e0779d4f1bf014ecc4e7e211d31ee34
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false

outputs:
  - staging:
      name: clang-tools-stage
    build:
      script:
        file: build.sh
    requirements:
      build:
        - clang ==${{ version }}
        - sysroot_linux-64 ==2.28
        - cmake ==3.31.8
        - ninja ==1.13.2
      host:
        - clang ==${{ version }}

  - package:
      name: clangd
    inherit: clang-tools-stage
    build:
      string: h${{ hash }}_${{ build_number }}
      files:
        - bin/clangd
    requirements:
      run:
        - clang ==${{ version }}
        - __glibc >=2.28
    tests:
      - script:
          - python3 devkit-build/check-package.py "${PREFIX}" --package clangd
        files:
          source:
            - devkit-build/check-package.py
      - package_contents:
          bin:
            - clangd
      - script:
          - python3 tests/clangd.py
        files:
          recipe:
            - tests/clangd.py
    about:
      homepage: https://clangd.llvm.org/
      summary: C and C++ language server with indexing, completion and clang-tidy checks

  - package:
      name: clang-tidy
    inherit: clang-tools-stage
    build:
      string: h${{ hash }}_${{ build_number }}
      files:
        - bin/clang-tidy
        - bin/clang-apply-replacements
        - bin/run-clang-tidy
        - lib/devkit/share/clang/clang-tidy-diff.py
    requirements:
      run:
        - clang ==${{ version }}
        - python ==3.14.8
        - __glibc >=2.28
    tests:
      - script:
          - python3 devkit-build/check-package.py "${PREFIX}" --package clang-tidy
        files:
          source:
            - devkit-build/check-package.py
      - package_contents:
          bin:
            - clang-tidy
            - clang-apply-replacements
            - run-clang-tidy
          files:
            - lib/devkit/share/clang/clang-tidy-diff.py
      - script:
          - bash tests/tidy.sh
        files:
          recipe:
            - tests/tidy.sh
    about:
      homepage: https://clang.llvm.org/extra/clang-tidy/
      summary: Clang-based C and C++ linter with static analysis and automatic fixes

about:
  license: Apache-2.0 WITH LLVM-exception
  license_file: llvm/LICENSE.TXT
  repository: https://github.com/llvm/llvm-project
