schema_version: 1

context:
  version: "0.26.13"

package:
  name: tree-sitter-cli
  version: ${{ version }}

source:
  - url: https://github.com/tree-sitter/tree-sitter/archive/v${{ version }}.tar.gz
    sha256: ece24c3c5e2a76384075e830c7139b59fce8fb01e4ef8436fab08bbe10444c89
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
  host:
    - llvm-libgcc ==23.1.3
  run:
    - __glibc >=2.28
    - llvm-libgcc ==23.1.3

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package tree-sitter-cli
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - tree-sitter
      files:
        - lib/devkit/share/bash-completion/completions/tree-sitter
        - lib/devkit/share/fish/vendor_completions.d/tree-sitter.fish
        - lib/devkit/share/zsh/site-functions/_tree-sitter
  - script:
      - test "$(tree-sitter --version | cut -d ' ' -f 1,2)" = "tree-sitter ${{ version }}"
      - bash tests/smoke.sh
    requirements:
      run:
        - clang ==23.1.3
    files:
      recipe:
        - tests/
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/tree-sitter" | grep -F '(RUNPATH)'
      - ldd "${PREFIX}/bin/tree-sitter" | grep -F 'libgcc_s.so.1 =>' | grep -F "${PREFIX}/"

about:
  homepage: https://tree-sitter.github.io/tree-sitter/
  repository: https://github.com/tree-sitter/tree-sitter
  license: MIT AND Unicode-DFS-2016
  license_file:
    - LICENSE
    - lib/src/unicode/LICENSE
  summary: CLI for generating, testing and using Tree-sitter parsers
