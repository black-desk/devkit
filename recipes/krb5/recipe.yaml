schema_version: 1
context:
  version: "1.22.2"
package:
  name: krb5
  version: ${{ version }}
source:
  - url: https://web.mit.edu/kerberos/dist/krb5/1.22/krb5-${{ version }}.tar.gz
    sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
    patches:
      - patches/native-development-install.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 7
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - pkgconf ==3.0.7
    - gnuconfig ==2025.07.09
    - gettext-tools ==0.25.1
    - sysroot_linux-64 ==2.28
  host:
    - openssl ==3.5.9
    - keyutils ==1.6.3
    - libedit ==3.1.20260512
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run_exports:
    strong:
      - krb5 >=1.22.2,<1.23
  run:
    - __glibc >=2.28
    - openssl >=3.5.9,<4
    - keyutils >=1.6.3,<2
    - libedit >=3.1.20260512,<3.2
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package krb5 ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - kinit
        - klist
      files:
        - lib/devkit/include/krb5-${{ version }}/krb5.h
        - lib/devkit/lib/libkrb5.so
        - lib/devkit/lib/libgssapi_krb5.so
        - lib/devkit/share/locale/de/LC_MESSAGES/mit-krb5.mo
        - lib/devkit/share/locale/ka/LC_MESSAGES/mit-krb5.mo
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/lib/devkit/share/devkit/clang.cfg" -O2 -fPIC
        -I"${PREFIX}/lib/devkit/include/krb5-${{ version }}"
        tests/probe.c "${PREFIX}/lib/devkit/lib/libkrb5.so"
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib/devkit/lib" -o library-probe
      - ./library-probe
      - '"${PREFIX}/lib/devkit/libexec/krb5/bin/krb5-config" --version | grep -F "1.22.2"'
      - readelf -d "${PREFIX}/lib/devkit/lib/libkrb5.so" | grep -F '(RUNPATH)'
    files:
      recipe:
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
about:
  homepage: https://web.mit.edu/kerberos/
  license: MIT
  license_file: NOTICE
  summary: Kerberos authentication libraries and tools with OpenSSL, keyutils and translations
