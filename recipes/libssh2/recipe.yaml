schema_version: 1
context:
  version: "1.11.1"
package:
  name: libssh2
  version: ${{ version }}
source:
  - url: https://www.libssh2.org/download/libssh2-${{ version }}.tar.gz
    sha256: d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7
  - path: ../clang
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - sysroot_linux-64 ==2.28
  host:
    - openssl ==3.5.9
    - zlib ==1.3.2
  run_exports:
    strong:
      - libssh2 >=1.11.1,<2
  run:
    - __glibc >=2.28
    - openssl >=3.5.9,<4
    - zlib >=1.3.2,<2
tests:
  - package_contents:
      files:
        - include/libssh2-${{ version }}/*.h
        - lib/libssh2.so
        - lib/libssh2.so.*
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - ln -s "${PREFIX}/lib" runtime-lib
      - ./library-probe
      - readelf -d "${PREFIX}/lib/libssh2.so" | grep -F '(RUNPATH)'
    files:
      source:
        - library-probe
about:
  homepage: https://www.libssh2.org/
  license: BSD-3-Clause
  license_file: COPYING
  summary: SSH2 library with OpenSSL and zlib compression
