schema_version: 1
context:
  version: "1.18"
package:
  name: libiconv
  version: ${{ version }}
source:
  - url: https://ftp.gnu.org/pub/gnu/libiconv/libiconv-${{ version }}.tar.gz
    sha256: 3b08f5f4f9b4eb82f151a7040bfd6fe6c6fb922efe4b1659c66ea933276965e8
    patches:
      - patches/clang-driver-link-policy.patch
      - patches/glibc-gets.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 6
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  host:
    - llvm-libgcc ==23.1.3
  run:
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libiconv ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - test -f "${PREFIX}/lib/devkit/include/libiconv-1.18/iconv.h"
      - test -f "${PREFIX}/lib/devkit/lib/libiconv.so"
      - test -f "${PREFIX}/lib/devkit/lib/libcharset.so"
      - test ! -f "${PREFIX}/bin/iconv"
      - readelf -d "${PREFIX}/lib/devkit/lib/libiconv.so" | grep -F '(RUNPATH)'
about:
  homepage: https://www.gnu.org/software/libiconv/
  license: LGPL-2.1-only
  license_file: COPYING.LIB
  summary: Character encoding conversion library with extra encodings enabled
