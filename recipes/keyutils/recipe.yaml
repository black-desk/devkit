schema_version: 1
context:
  version: "1.6.3"
package:
  name: keyutils
  version: ${{ version }}
source:
  - url: https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/snapshot/keyutils-${{ version }}.tar.gz
    sha256: a61d5706136ae4c05bd48f86186bcfdbd88dd8bd5107e3e195c924cfc1b39bb4
    patches:
      - patches/development-install.patch
      # TODO: Upstream the correction of the two nonexistent versioned symbols.
      - patches/remove-nonexistent-version-symbols.patch
      - patches/0001-Make-endian-detection-in-work-on-non-RHEL-distributi.patch
      - patches/0002-Fix-installing-shared-library-symlinks-with-DESTDIR.patch
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 3
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - sysroot_linux-64 ==2.28
  run_exports:
    strong:
      - keyutils >=1.6.3,<2
  run:
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package keyutils
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/include/keyutils-${{ version }}/*.h
        - lib/devkit/lib/libkeyutils.so
        - lib/libkeyutils.so.*
        - lib/devkit/lib/pkgconfig/libkeyutils.pc
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" -O2 -fPIC
        -I"${PREFIX}/lib/devkit/include/keyutils-${{ version }}"
        tests/probe.c "${PREFIX}/lib/devkit/lib/libkeyutils.so"
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o library-probe
      - ./library-probe
      - readelf -d "${PREFIX}/lib/devkit/lib/libkeyutils.so" | grep -F '(RUNPATH)'
      - keyctl --version | grep -F 1.6.3
    files:
      recipe:
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
about:
  homepage: https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/
  license: LGPL-2.1-or-later AND GPL-2.0-or-later
  license_file: LICENCE.LGPL
  summary: Linux key management library and utilities
