schema_version: 1
context:
  version: 1.5.7
package:
  name: zstd
  version: ${{ version }}
source:
  - url: https://github.com/facebook/zstd/archive/v${{ version }}.tar.gz
    sha256: 37d7284556b20954e56e1ca85b80226768902e2edabd3b649e9e72c0c9012ee3
    patches:
      - patches/build-tree-rpath.patch
  - path: ../clang
    target_directory: devkit-build
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
      LIBRARY_VERSION: ${{ version }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - sysroot_linux-64 ==2.28
    - gnuconfig ==2025.07.09
    - cmake ==3.31.8
    - ninja ==1.13.2
  host:
    - zlib ==1.3.2
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run:
    - zlib >=1.3.2,<1.4
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - zstd --version
      - pzstd --version
      - printf "bootstrap gzip compatibility\n" > input
      - zstd --format=gzip input -o input.gz
      - zstd -d input.gz -o restored
      - cmp input restored
      - readelf -d "${PREFIX}/lib/libzstd.so.1" | grep -F "(RUNPATH)"
about:
  homepage: https://facebook.github.io/zstd/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Zstandard compression library and tools including gzip support and pzstd
