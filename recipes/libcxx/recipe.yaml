schema_version: 1

context:
  version: "23.1.3"

package:
  name: libcxx
  version: ${{ version }}

source:
  - url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ version }}/llvm-project-${{ version }}.src.tar.xz
    sha256: c44186a7762ed28954be72e5ff6df9808e0779d4f1bf014ecc4e7e211d31ee34
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 6
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
      LIBCXX_VERSION: ${{ version }}

requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - sysroot_linux-64 ==2.28
  host:
    - llvm-libgcc ==23.1.3
  run:
    - llvm-libgcc ==23.1.3
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libcxx
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/libc++.so.1
        - lib/libc++abi.so.1
        - lib/devkit/include/libcxx-${{ version }}/c++/v1/iostream
  - script:
      - >-
        "${PREFIX}/bin/clang++" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg"
        --unwindlib=none -O2 -std=c++20 -nostdlib++
        tests/runtime.cpp -lc++ -lc++abi -lgcc_s -ldl -pthread
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib"
        -o libcxx-probe
      - readelf -d "${PREFIX}/lib/libc++.so.1" | grep -F '(RUNPATH)'
      - readelf -d "${PREFIX}/lib/libc++abi.so.1" | grep -F '(RUNPATH)'
      - ./libcxx-probe "${PREFIX}"
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
    files:
      recipe:
        - tests/runtime.cpp

about:
  homepage: https://libcxx.llvm.org/
  license: Apache-2.0 WITH LLVM-exception
  license_file:
    - libcxx/LICENSE.TXT
    - libcxxabi/LICENSE.TXT
  summary: LLVM C++ standard library and ABI runtime for explicit channel builds
  description: libc++ and libc++abi using the channel llvm-libgcc unwinder, with version-isolated development headers.
  repository: https://github.com/llvm/llvm-project
