schema_version: 1

context:
  version: "4.4.1"

package:
  name: make
  version: ${{ version }}

source:
  - url: https://ftp.gnu.org/gnu/make/make-${{ version }}.tar.gz
    sha256: dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3

  - path: ../clang
    target_directory: devkit-build
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      SYSROOT_TRIPLET: "${{ sysroot_triplet }}"

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - gnuconfig ==2025.07.09
    - sysroot_linux-64
tests:
  - package_contents:
      bin:
        - make

  - script:
      - make --version
      - test "$(make -f tests/Makefile)" = local-make-ok
    files:
      recipe:
        - tests/

about:
  homepage: https://www.gnu.org/software/make/
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: GNU Make for the devkit bootstrap build environment
  description: GNU Make built by the self-hosted devkit compiler with an explicitly selected sysroot.
  repository: https://git.savannah.gnu.org/git/make.git
  documentation: https://www.gnu.org/software/make/manual/

extra:
  bootstrap-role: build-tool
