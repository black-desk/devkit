schema_version: 1

context:
  version: "23.1.3"

recipe:
  name: llvm-libgcc
  version: ${{ version }}

source:
  - url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ version }}/llvm-project-${{ version }}.src.tar.xz
    sha256: c44186a7762ed28954be72e5ff6df9808e0779d4f1bf014ecc4e7e211d31ee34
    patches:
      - patches/libgcc-soname.patch
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

outputs:
  - package:
      name: llvm-libgcc
    build:
      number: 6
      string: h${{ hash }}_${{ build_number }}
      dynamic_linking:
        # CMake installs $ORIGIN RUNPATH; automatic relinking converts it to RPATH.
        binary_relocation: false
      script:
        file: build.sh
        env:
          SYSROOT_TRIPLET: ${{ sysroot_triplet }}

    requirements:
      build:
        - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
          then:
            - clang-23 ==23.1.3
            - llvm-tools ==23.1.3
            - lld ==23.1.2
            - libgcc-devel_linux-64 ==16.2.0
            - libstdcxx-devel_linux-64 ==16.2.0
          else:
            - clang ==23.1.3
        - cmake ==3.31.8
        - ninja ==1.13.2
        - sysroot_linux-64 ==2.28
      run:
        - __glibc >=2.28

    tests:
      - script:
          - python3 devkit-build/check-package.py "${PREFIX}" --package llvm-libgcc
        files:
          source:
            - devkit-build/check-package.py
      - package_contents:
          files:
            - lib/devkit/lib/libgcc.a
            - lib/devkit/lib/libgcc_eh.a
            - lib/devkit/lib/libgcc_s.so
            - lib/libgcc_s.so.1
            - lib/libunwind.so.1
            - lib/linux/clang_rt.crtbegin-x86_64.o
            - lib/linux/clang_rt.crtend-x86_64.o
      - script:
          - >-
            "${PREFIX}/bin/clang" --no-default-config
            --config="${PREFIX}/share/devkit/clang.cfg"
            --unwindlib=none -O2
            -isystem "${PREFIX}/lib/devkit/include/libunwind-${{ version }}"
            tests/runtime.c -ldl "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib"
            -o runtime-probe
          - readelf -d "${PREFIX}/lib/libgcc_s.so.1" | grep -F '(RUNPATH)'
          - ./runtime-probe "${PREFIX}/lib/libgcc_s.so.1"
          - ./runtime-probe libunwind.so.1
        requirements:
          run:
            - clang ==23.1.3
            - sysroot_linux-64 ==2.28
        files:
          recipe:
            - tests/runtime.c

  # Dirty and seed share the channel list for BOTH build and host solves.
  # Separate prefixes do not keep build tools' transitive dependencies in seed:
  # seed clang-23 can select dirty libxml2, which pulls in llvm-libgcc; rebuilt
  # ninja also pulls in llvm-libgcc. Seed clang/libstdcxx still require libgcc,
  # so without this meta both GNU libgcc and llvm-libgcc would install the same
  # lib/libgcc_s.so.1 into BUILD_PREFIX. This empty package satisfies the seed
  # libstdcxx exact version/build pin while llvm-libgcc supplies the actual files.
  # Thus seed tools in that mixed environment also run against LLVM-libgcc;
  # this is compatibility substitution, not isolation of their GNU runtime.
  # Copy version, build string and build number from seed libgcc metadata.
  # The skip condition below limits this output to dirty; result omits it.
  # TODO: Remove when a supported solve policy keeps the entire build-tool
  # dependency closure in seed while allowing dirty libraries in the host prefix.
  - package:
      name: libgcc
      version: ${{ seed_libgcc_version | default('0') }}
    build:
      skip: sysroot_triplet != 'x86_64-conda-linux-gnu'
      number: ${{ seed_libgcc_build_number | default(0) }}
      string: ${{ seed_libgcc_build | default('bootstrap-only') }}
      noarch: generic
      script:
        - test -n "${{ seed_libgcc_version | default('') }}"
        - test -n "${{ seed_libgcc_build | default('') }}"
    requirements:
      run:
        - ${{ pin_subpackage('llvm-libgcc', exact=True) }}
    tests:
      - script:
          - test -f "${PREFIX}/lib/libgcc_s.so.1"
    about:
      summary: Temporary seed libgcc dependency interface backed by LLVM
      description: Metadata-only dirty bootstrap compatibility output. It matches the seed libstdcxx pin and contains no GNU library files.

about:
  homepage: https://github.com/llvm/llvm-project/tree/main/llvm-libgcc
  license: Apache-2.0 WITH LLVM-exception
  license_file: llvm/LICENSE.TXT
  summary: LLVM implementation of GCC-compatible compiler and unwind runtimes
  description: compiler-rt builtins and LLVM libunwind exporting the libgcc runtime interface and GCC symbol versions, built without a GCC compiler.
  repository: https://github.com/llvm/llvm-project
