schema_version: 1

context:
  version: "5.44.0"

package:
  name: perl
  version: ${{ version }}

source:
  - url: https://www.cpan.org/src/5.0/perl-${{ version }}.tar.xz
    sha256: 505cf43912e9480495c344c70260452e32aa2a73c546a026b3f100053b23ce91
    patches:
      - patches/deterministic-remote-debugger-port.patch

  - path: ../clang
    target_directory: devkit-build
build:
  number: 2
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      PERL_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - sysroot_linux-64 ==2.28
  host:
    - libxcrypt ==4.4.38
  run:
    - libxcrypt >=4.4.38,<5
    - __glibc >=2.28
tests:
  - package_contents:
      bin:
        - perl
        - pod2text
        - perlbug
      files:
        - lib/perl5/${{ version }}/x86_64-linux-thread-multi/Config.pm

  - script:
      - test "$(command -v perl)" = "${PREFIX}/bin/perl"
      - perl -v | grep -F "v${{ version }}"
      - perl -e 'print "perl-ok\n"'
      - test "$(perl -V:d_crypt)" = "d_crypt='define';"
      - perl -e 'die "crypt unavailable" unless crypt("devkit", q{$6$devkit$}) =~ /^\$6\$devkit\$/;'
      - readelf -d "${PREFIX}/bin/perl" | grep -F '[libcrypt.so.2]'
      - perl -Mstrict -Mwarnings -e 'print "core-modules-ok\n"'
      - >-
        perl -MPOSIX -MSocket -MStorable -MTest::More -e 'print
        "dynamic-modules-ok\n"'
      - >-
        perl -e 'print "$_\n" for @INC' | grep -F
        "${PREFIX}/lib/perl5/${{ version }}/"
      - test "$(perl -V:usethreads)" = "usethreads='define';"
      - >-
        test "$(perl -V:userelocatableinc)" =
        "userelocatableinc='define';"
      - test "$(perl -V:cf_by)" = "cf_by='black-desk';"
        # Config{sysroot} is XS-extension build metadata, not a dependency of
        # pure-Perl execution. It resolves beside the active interpreter; code
        # compiling XS modules must explicitly use the channel compiler and
        # sysroot packages rather than relying on the host-integrating Clang
        # default.
      - >-
        test "$(perl -V:sysroot)" =
        "sysroot='${PREFIX}/x86_64-pc-linux-gnu/sysroot';"

about:
  homepage: https://www.perl.org/
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file:
    - Artistic
    - Copying
  summary: The Perl 5 programming language interpreter
  description: A relocatable Perl interpreter and core module set used by OpenSSL and Git builds.
  repository: https://github.com/Perl/perl5
  documentation: https://www.perl.org/docs.html
