schema_version: 1

context:
  version: "5.44.0"

package:
  name: perl
  version: ${{ version }}

source:
  - url: https://www.cpan.org/src/5.0/perl-${{ version }}.tar.xz
    sha256: 505cf43912e9480495c344c70260452e32aa2a73c546a026b3f100053b23ce91
    patches:
      - patches/deterministic-remote-debugger-port.patch

  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 8
  string: h${{ hash }}_${{ build_number }}
  # Native builds record compiler and library paths under one relocatable prefix.
  merge_build_and_host_envs: true
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      PERL_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - sysroot_linux-64 ==2.28
  host:
    - libxcrypt ==4.4.38
  run:
    - libxcrypt >=4.4.38,<5
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package perl ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - perl
        - pod2text
        - perlbug
      files:
        - lib/devkit/lib/perl5/${{ version }}/x86_64-linux-thread-multi/Config.pm

  - script:
      - test "$(command -v perl)" = "${PREFIX}/bin/perl"
      - perl -v | grep -F "v${{ version }}"
      - perl -e 'print "perl-ok\n"'
      - test "$(perl -V:d_crypt)" = "d_crypt='define';"
      - perl -e 'die "crypt unavailable" unless crypt("devkit", q{$6$devkit$}) =~ /^\$6\$devkit\$/;'
      - readelf -d "${PREFIX}/bin/perl" | grep -F '[libcrypt.so.2]'
      - perl -Mstrict -Mwarnings -e 'print "core-modules-ok\n"'
      - >-
        test "$(perl -MConfig -e 'print $Config{cc}')" =
        "${PREFIX}/bin/${{ 'clang-23' if sysroot_triplet == 'x86_64-conda-linux-gnu' else 'clang' }}"
      - >-
        perl -MPOSIX -MSocket -MStorable -MTest::More -e 'print
        "dynamic-modules-ok\n"'
      - >-
        perl -e 'print "$_\n" for @INC' | grep -F
        "${PREFIX}/lib/devkit/lib/perl5/${{ version }}/"
      - test "$(perl -V:usethreads)" = "usethreads='define';"
      - >-
        test "$(perl -V:userelocatableinc)" =
        "userelocatableinc='define';"
      - test "$(perl -V:cf_by)" = "cf_by='black-desk';"
        # Conda relocates the original compiler/sysroot metadata at install.
        # Pure-Perl execution does not require these build tools to be installed.
      - >-
        test "$(perl -V:sysroot)" =
        "sysroot='${PREFIX}/${{ sysroot_triplet }}/sysroot';"

  - script:
      - cd tests
      - perl Makefile.PL
      - make -j"${CPU_COUNT}"
      - perl -Mblib -MDevkit::PrefixProbe -e 'die unless Devkit::PrefixProbe::answer() == 42; print "installed XS build OK\n";'
    requirements:
      run:
        - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
          then:
            - clang-23 ==23.1.3
            - llvm-tools ==23.1.3
            - lld ==23.1.2
            - libgcc-devel_linux-64 ==16.2.0
          else:
            - clang ==23.1.3
        - make ==4.4.1
        - sysroot_linux-64 ==2.28
    files:
      recipe:
        - tests/Makefile.PL
        - tests/PrefixProbe.xs
        - tests/lib/Devkit/PrefixProbe.pm

about:
  homepage: https://www.perl.org/
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file:
    - Artistic
    - Copying
  summary: The Perl 5 programming language interpreter
  description: A relocatable Perl interpreter and core module set used by OpenSSL and Git builds.
  repository: https://github.com/Perl/perl5
  documentation: https://www.perl.org/docs.html
