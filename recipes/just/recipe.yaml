schema_version: 1

context:
  version: "1.58.0"

package:
  name: just
  version: ${{ version }}

source:
  - url: https://github.com/casey/just/archive/refs/tags/${{ version }}.tar.gz
    sha256: c8a36e6e9397f2fdfcb0cc246fcdb790b52a784f3c8cabc0d8baeb031852a148
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 2
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
  run:
    - __glibc >=2.28
    - llvm-libgcc ==23.1.3
  host:
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package just
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - just
      files:
        - share/bash-completion/completions/just
        - share/fish/vendor_completions.d/just.fish
        - share/zsh/site-functions/_just
        - share/man/man1/just.1
  - script:
      - test "$(just --version)" = "just ${{ version }}"
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/

  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/just" | grep -F "(RUNPATH)"
      - ldd "${PREFIX}/bin/just" | grep -F "libgcc_s.so.1 =>" | grep -F "${PREFIX}/"
about:
  homepage: https://github.com/casey/just
  license: CC0-1.0
  license_file: LICENSE
  summary: A command runner for project-specific tasks
  description: Built from pinned upstream source and Cargo.lock with the devkit Rust toolchain and glibc 2.28 sysroot.
  repository: https://github.com/casey/just
