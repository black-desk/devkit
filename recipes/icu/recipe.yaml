schema_version: 1
context:
  version: "78.3"
package:
  name: icu
  version: ${{ version }}
source:
  - url: https://github.com/unicode-org/icu/releases/download/release-${{ version }}/icu4c-${{ version }}-sources.tgz
    sha256: 3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0
    patches:
      - patches/skip-disabled-test-data.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 6
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  host:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package icu ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD ICU_DATA
      - >-
        "${PREFIX}/bin/clang++" --no-default-config
        --config="${PREFIX}/lib/devkit/share/devkit/clang.cfg" --unwindlib=none -O2 -fPIC -std=c++17
        -I"${PREFIX}/lib/devkit/include/icu-${{ version }}"
        tests/runtime.cpp -licui18n -licuuc -licudata -lgcc_s
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib/devkit/lib" -o icu-runtime-probe
      - ./icu-runtime-probe
      - icuinfo
      - test -f "${PREFIX}/lib/devkit/include/icu-${{ version }}/unicode/ucnv.h"
      - for library in icudata icuuc icui18n icuio icutu; do readelf -d "${PREFIX}/lib/devkit/lib/lib${library}.so" | grep -F '(RUNPATH)'; done
    files:
      recipe:
        - tests/runtime.cpp
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
about:
  homepage: https://icu.unicode.org/
  license: Unicode-3.0
  license_file: LICENSE
  summary: International Components for Unicode with official release data
