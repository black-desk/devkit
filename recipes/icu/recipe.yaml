schema_version: 1
context:
  version: "78.3"
package:
  name: icu
  version: ${{ version }}
source:
  - url: https://github.com/unicode-org/icu/releases/download/release-${{ version }}/icu4c-${{ version }}-sources.tgz
    sha256: 3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0
    patches:
      - patches/skip-disabled-test-data.patch
  - path: tests
    target_directory: devkit-tests
  - path: ../clang
    target_directory: devkit-build
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  host:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD ICU_DATA
      - ln -s "${PREFIX}/lib" runtime-lib
      - ./icu-runtime-probe
      - icuinfo
      - test -f "${PREFIX}/lib/devkit/include/icu-${{ version }}/unicode/ucnv.h"
      - for library in icudata icuuc icui18n icuio icutu; do readelf -d "${PREFIX}/lib/devkit/lib/lib${library}.so" | grep -F '(RUNPATH)'; done
    files:
      source:
        - icu-runtime-probe
about:
  homepage: https://icu.unicode.org/
  license: Unicode-3.0
  license_file: LICENSE
  summary: International Components for Unicode with official release data
