schema_version: 1
context:
  version: "4.33"
package:
  name: libev
  version: ${{ version }}
source:
  - url: https://dist.schmorp.de/libev/Attic/libev-${{ version }}.tar.gz
    sha256: 507eb7b8d1015fbec5b935f34ebed15bf346bed04a11ab82b8eee848c4205aea
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 6
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  run_exports:
    strong:
      - libev >=4.33,<5
  run:
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libev ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/include/libev-${{ version }}/*.h
        - lib/devkit/lib/libev.so
        - lib/devkit/lib/libev.so.*
        - lib/devkit/lib/libev.a
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/lib/devkit/share/devkit/clang.cfg" -O2 -fPIC
        -I"${PREFIX}/lib/devkit/include/libev-${{ version }}"
        tests/probe.c "${PREFIX}/lib/devkit/lib/libev.so"
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib/devkit/lib" -o library-probe
      - ./library-probe
      - readelf -d "${PREFIX}/lib/devkit/lib/libev.so" | grep -F '(RUNPATH)'
    files:
      recipe:
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
about:
  homepage: https://software.schmorp.de/pkg/libev.html
  license: BSD-2-Clause OR GPL-2.0-or-later
  license_file: LICENSE
  summary: Event loop library with libevent compatibility interface
