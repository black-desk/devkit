schema_version: 1

context:
  version: "8.22.0"
  openssl_version: "3.5.9"
  zlib_version: "1.3.2"

package:
  name: curl
  version: ${{ version }}

source:
  url: https://github.com/curl/curl/releases/download/curl-8_22_0/curl-8.22.0.tar.xz
  sha256: f7ef3ae8a22e521f289803fe93543eb64c329b58aa73a9e224dfd915a2a5f4f7
  patches:
    - patches/curl-config-exact-paths.patch

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      CURL_VERSION: ${{ version }}
      OPENSSL_VERSION: ${{ openssl_version }}
      ZLIB_VERSION: ${{ zlib_version }}
      SYSROOT_TRIPLET: x86_64-pc-linux-gnu

requirements:
  build:
    - gcc ==16.2.0 meta_hb0f4dca_0
    - binutils ==2.46.1 h8204064_0
    - make ==4.4.1 h8204064_0
    - openssl ==3.5.9 hb0f4dca_0
    - pkgconf ==3.0.7 hb0f4dca_0
    - zlib ==1.3.2 hb0f4dca_0
    - sysroot_linux-64 ==2.28 h8204064_0
  run:
    - openssl >=3.5.9,<4
    - zlib >=1.3.2,<1.4
    - ca-certificates >=2026.09.25
  run_exports:
    strong:
      - curl >=8.22.0,<9

tests:
  - package_contents:
      bin:
        - curl
      files:
        - include/curl-${{ version }}/curl/curl.h
        - include/curl-${{ version }}/curl/curlver.h
        - include/curl-${{ version }}/curl/easy.h
        - include/curl-${{ version }}/curl/header.h
        - include/curl-${{ version }}/curl/multi.h
        - include/curl-${{ version }}/curl/mprintf.h
        - include/curl-${{ version }}/curl/options.h
        - include/curl-${{ version }}/curl/stdcheaders.h
        - include/curl-${{ version }}/curl/system.h
        - include/curl-${{ version }}/curl/typecheck-gcc.h
        - include/curl-${{ version }}/curl/urlapi.h
        - include/curl-${{ version }}/curl/websockets.h
        - lib/libcurl.so
        - lib/libcurl.so.4
        - lib/libcurl.so.4.8.0
        - lib/libcurl.a
        - lib/pkgconfig/libcurl.pc
        - libexec/curl/bin/curl-config

  - script:
      - test "$(command -v pkg-config)" = "${PREFIX}/bin/pkg-config"
      - test ! -e "${PREFIX}/bin/curl-config"
      - test ! -e "${PREFIX}/bin/wcurl"
      - test ! -e "${PREFIX}/include/curl"
      - test ! -e "${PREFIX}/lib/cmake/CURL"
      - test "$(readlink "${PREFIX}/lib/libcurl.so")" = "libcurl.so.4.8.0"
      - >-
        test "$(readlink "${PREFIX}/lib/libcurl.so.4")" =
        "libcurl.so.4.8.0"
      - curl_version="$("${PREFIX}/bin/curl" --version)"
      - >-
        printf '%s\n' "$curl_version" |
        grep -F "libcurl/${{ version }}"
      - >-
        printf '%s\n' "$curl_version" |
        grep -F "OpenSSL/${{ openssl_version }}"
      - >-
        printf '%s\n' "$curl_version" | grep -F 'libz'
      - printf 'devkit libcurl transfer\n' > curl-input.txt
      - >-
        "${PREFIX}/bin/curl" --fail --silent --show-error
        "file://${PWD}/curl-input.txt" > curl-output.txt
      - cmp curl-input.txt curl-output.txt
      - curl_config="${PREFIX}/libexec/curl/bin/curl-config"
      - test -x "${curl_config}"
      - sh -n "${curl_config}"
      - test "$("${curl_config}" --prefix)" = "${PREFIX}"
      - test "$("${curl_config}" --built-shared)" = "yes"
      - >-
        test "$("${curl_config}" --version)" =
        "libcurl ${{ version }}"
      - >-
        test "$("${curl_config}" --cflags)" =
        "-I${PREFIX}/include/curl-${{ version }}"
      - >-
        test "$("${curl_config}" --libs)" =
        "${PREFIX}/lib/libcurl.so"
      - >-
        test "$("${curl_config}" --ca)" =
        "${PREFIX}/etc/ssl/certs/ca-certificates.crt"
      - >-
        test "$("${curl_config}" --cc)" = "${PREFIX}/bin/gcc"
      - >-
        test "$("${curl_config}" --ssl-backends)" = "OpenSSL"
      - >-
        "${curl_config}" --features | grep -Fx SSL
      - >-
        "${curl_config}" --features | grep -Fx libz
      - >-
        "${curl_config}" --protocols | grep -Fx HTTPS
      - >-
        "${curl_config}" --protocols | grep -Fx FTP
      - >-
        if "${curl_config}" --features | grep -Fx HTTP2; then exit 1; fi
      - >-
        if "${curl_config}" --protocols |
        grep -Ex 'SCP|SFTP'; then exit 1; fi
      - >-
        test "$("${curl_config}" --static-libs)" =
        "${PREFIX}/lib/libcurl.a ${PREFIX}/lib/libssl.a ${PREFIX}/lib/libcrypto.a ${PREFIX}/lib/libz.a -ldl -pthread"
      - >-
        "${curl_config}" --checkfor ${{ version }}
      - >-
        if "${curl_config}" --checkfor 8.23.0 >/dev/null 2>&1;
        then exit 1; fi
      - >-
        "${curl_config}" --help | grep -F -- --static-libs
      - >-
        if "${curl_config}" --not-an-option >/dev/null 2>&1;
        then exit 1; fi
      - export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"
      - pc_path="$("${PREFIX}/bin/pkg-config" --path libcurl)"
      - pc_root="$(dirname "$pc_path")/../.."
      - cflags="$("${PREFIX}/bin/pkg-config" --cflags libcurl)"
      - cflags="${cflags% }"
      - >-
        test "$cflags" =
        "-I${pc_root}/include/curl-${{ version }}"
      - libs="$("${PREFIX}/bin/pkg-config" --libs libcurl)"
      - libs="${libs% }"
      - test "$libs" = "${pc_root}/lib/libcurl.so"
      - static_libs="$("${PREFIX}/bin/pkg-config" --static --libs libcurl)"
      - static_libs="${static_libs% }"
      - >-
        test "$static_libs" =
        "${pc_root}/lib/libcurl.so ${pc_root}/lib/libssl.a ${pc_root}/lib/libcrypto.a ${pc_root}/lib/libz.a -ldl -pthread"
      - >-
        test "$("${PREFIX}/bin/pkg-config" --modversion libcurl)" =
        "${{ version }}"
      - curl_dependencies="$(ldd "${PREFIX}/bin/curl")"
      - >-
        echo "$curl_dependencies" | grep -F 'libcurl.so.4 =>' |
        grep -F "${PREFIX}/"
      - >-
        echo "$curl_dependencies" | grep -F 'libssl.so.3 =>' |
        grep -F "${PREFIX}/"
      - >-
        echo "$curl_dependencies" | grep -F 'libcrypto.so.3 =>' |
        grep -F "${PREFIX}/"
      - >-
        echo "$curl_dependencies" | grep -F 'libz.so.1 =>' |
        grep -F "${PREFIX}/"
      - test -f "${PREFIX}/etc/ssl/certs/ca-certificates.crt"
    requirements:
      run:
        - pkgconf ==3.0.7 hb0f4dca_0

about:
  homepage: https://curl.se/
  license: curl
  license_file: COPYING
  summary: Command-line tool and library for transferring data with URLs
  description: The curl command and libcurl library used by Git for HTTPS transport.
  repository: https://github.com/curl/curl
  documentation: https://curl.se/docs/
