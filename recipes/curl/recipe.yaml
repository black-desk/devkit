schema_version: 1

context:
  version: "8.22.0"
  openssl_version: "3.5.9"
  zlib_version: "1.3.2"

recipe:
  name: curl
  version: ${{ version }}

source:
  - url: https://github.com/curl/curl/releases/download/curl-8_22_0/curl-8.22.0.tar.xz
    sha256: f7ef3ae8a22e521f289803fe93543eb64c329b58aa73a9e224dfd915a2a5f4f7
    patches:
      - patches/development-install.patch
      - patches/clang-driver-link-policy.patch
      - patches/curl-config-exact-paths.patch
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

outputs:
  - package:
      name: curl
    build:
      number: 5
      string: h${{ hash }}_${{ build_number }}
      script:
        file: build.sh
        env:
          CURL_VERSION: ${{ version }}
          OPENSSL_VERSION: ${{ openssl_version }}
          ZLIB_VERSION: ${{ zlib_version }}
          SYSROOT_TRIPLET: ${{ sysroot_triplet }}

      dynamic_linking:
        binary_relocation: false
    requirements:
      build:
        - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
          then:
            - clang-23 ==23.1.3
            - llvm-tools ==23.1.3
            - lld ==23.1.2
            - libgcc-devel_linux-64 ==16.2.0
          else:
            - clang ==23.1.3
        - make ==4.4.1
        - pkgconf ==3.0.7
        - gnuconfig ==2025.07.09
        - perl ==5.44.0
        - sysroot_linux-64 ==2.28
      run:
        - openssl >=3.5.9,<4
        - zlib >=1.3.2,<1.4
        - ca-certificates >=2026.09.25
        - libnghttp2 >=1.68.1,<2
        - libssh2 >=1.11.1,<2
        - krb5 >=1.22.2,<1.23
        - libpsl >=0.23.1,<0.24
        - zstd >=1.5.7,<2
        - __glibc >=2.28
      run_exports:
        strong:
          - curl >=8.22.0,<9

      host:
        - openssl ==3.5.9
        - zlib ==1.3.2
        - zstd ==1.5.7
        - krb5 ==1.22.2
        - libssh2 ==1.11.1
        - libnghttp2 ==1.68.1
        - libpsl ==0.23.1
    tests:
      - script:
          - python3 devkit-build/check-package.py "${PREFIX}" --package curl
        files:
          source:
            - devkit-build/check-package.py
      - package_contents:
          bin:
            - curl
          files:
            - lib/devkit/include/curl-${{ version }}/curl/curl.h
            - lib/devkit/include/curl-${{ version }}/curl/curlver.h
            - lib/devkit/include/curl-${{ version }}/curl/easy.h
            - lib/devkit/include/curl-${{ version }}/curl/header.h
            - lib/devkit/include/curl-${{ version }}/curl/multi.h
            - lib/devkit/include/curl-${{ version }}/curl/mprintf.h
            - lib/devkit/include/curl-${{ version }}/curl/options.h
            - lib/devkit/include/curl-${{ version }}/curl/stdcheaders.h
            - lib/devkit/include/curl-${{ version }}/curl/system.h
            - lib/devkit/include/curl-${{ version }}/curl/typecheck-gcc.h
            - lib/devkit/include/curl-${{ version }}/curl/urlapi.h
            - lib/devkit/include/curl-${{ version }}/curl/websockets.h
            - lib/devkit/lib/libcurl.so
            - lib/libcurl.so.4
            - lib/libcurl.so.4.8.0
            - lib/devkit/lib/libcurl.a
            - lib/devkit/lib/pkgconfig/libcurl.pc
            - libexec/curl/bin/curl-config

      - script:
          - test "$(command -v pkg-config)" = "${PREFIX}/bin/pkg-config"
          - test ! -e "${PREFIX}/bin/curl-config"
          - test ! -e "${PREFIX}/bin/wcurl"
          - test ! -e "${PREFIX}/include/curl"
          - test ! -e "${PREFIX}/lib/devkit/lib/cmake/CURL"
          - test "$(readlink "${PREFIX}/lib/devkit/lib/libcurl.so")" = "../../libcurl.so.4.8.0"
          - >-
            test "$(readlink "${PREFIX}/lib/libcurl.so.4")" =
            "libcurl.so.4.8.0"
          - unset LD_LIBRARY_PATH LD_PRELOAD
          - private_libraries=()
          - >-
            for library in ssl crypto z nghttp2 ssh2 gssapi_krb5 krb5 k5crypto com_err psl zstd; do
            private_libraries+=("${PREFIX}/lib/devkit/lib/lib${library}.so"); done
          - >-
            "${PREFIX}/bin/clang" --no-default-config
            --config="${PREFIX}/share/devkit/clang.cfg" -O2 -fPIC
            -I"${PREFIX}/lib/devkit/include/curl-${{ version }}"
            tests/probe.c "${PREFIX}/lib/devkit/lib/libcurl.so"
            "${private_libraries[@]}" -ldl -pthread
            "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o library-probe
          - >-
            "${PREFIX}/bin/clang" --no-default-config
            --config="${PREFIX}/share/devkit/clang.cfg" -O2 -fPIC
            -I"${PREFIX}/lib/devkit/include/curl-${{ version }}"
            tests/probe.c "${PREFIX}/lib/devkit/lib/libcurl.a"
            "${private_libraries[@]}" -ldl -pthread
            "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o static-probe
          - ./library-probe
          - ./static-probe
          - curl_version="$("${PREFIX}/bin/curl" --version)"
          - >-
            printf '%s\n' "$curl_version" |
            grep -F "libcurl/${{ version }}"
          - >-
            printf '%s\n' "$curl_version" |
            grep -F "OpenSSL/${{ openssl_version }}"
          - >-
            printf '%s\n' "$curl_version" | grep -F 'libz'
          - printf 'devkit libcurl transfer\n' > curl-input.txt
          - >-
            "${PREFIX}/bin/curl" --fail --silent --show-error
            "file://${PWD}/curl-input.txt" > curl-output.txt
          - cmp curl-input.txt curl-output.txt
          - curl_config="${PREFIX}/libexec/curl/bin/curl-config"
          - test -x "${curl_config}"
          - sh -n "${curl_config}"
          - test "$("${curl_config}" --prefix)" = "${PREFIX}"
          - test "$("${curl_config}" --built-shared)" = "yes"
          - >-
            test "$("${curl_config}" --version)" =
            "libcurl ${{ version }}"
          - >-
            test "$("${curl_config}" --cflags)" =
            "-I${PREFIX}/lib/devkit/include/curl-${{ version }}"
          - >-
            test "$("${curl_config}" --libs)" =
            "${PREFIX}/lib/devkit/lib/libcurl.so"
          - >-
            test "$("${curl_config}" --ca)" =
            "${PREFIX}/etc/ssl/certs/ca-certificates.crt"
          - >-
            test "$("${curl_config}" --cc)" = "${PREFIX}/bin/clang"
          - >-
            test "$("${curl_config}" --ssl-backends)" = "OpenSSL"
          - >-
            "${curl_config}" --features | grep -Fx SSL
          - >-
            "${curl_config}" --features | grep -Fx libz
          - >-
            "${curl_config}" --protocols | grep -Fx HTTPS
          - >-
            "${curl_config}" --protocols | grep -Fx FTP
          - >-
            "${curl_config}" --features | grep -Fx HTTP2
          - >-
            "${curl_config}" --protocols | grep -Fx SFTP
          - >-
            test "$("${curl_config}" --static-libs)" =
            "${PREFIX}/lib/devkit/lib/libcurl.a ${PREFIX}/lib/devkit/lib/libssl.so ${PREFIX}/lib/devkit/lib/libcrypto.so ${PREFIX}/lib/devkit/lib/libz.so ${PREFIX}/lib/devkit/lib/libnghttp2.so ${PREFIX}/lib/devkit/lib/libssh2.so ${PREFIX}/lib/devkit/lib/libgssapi_krb5.so ${PREFIX}/lib/devkit/lib/libkrb5.so ${PREFIX}/lib/devkit/lib/libk5crypto.so ${PREFIX}/lib/devkit/lib/libcom_err.so ${PREFIX}/lib/devkit/lib/libpsl.so ${PREFIX}/lib/devkit/lib/libzstd.so -ldl -pthread"
          - >-
            "${curl_config}" --checkfor ${{ version }}
          - >-
            if "${curl_config}" --checkfor 8.23.0 >/dev/null 2>&1;
            then exit 1; fi
          - >-
            "${curl_config}" --help | grep -F -- --static-libs
          - >-
            if "${curl_config}" --not-an-option >/dev/null 2>&1;
            then exit 1; fi
          - export PKG_CONFIG_PATH="${PREFIX}/lib/devkit/lib/pkgconfig"
          - pc_path="$("${PREFIX}/bin/pkg-config" --path libcurl)"
          - pc_root="$(dirname "$pc_path")/../.."
          - cflags="$("${PREFIX}/bin/pkg-config" --cflags libcurl)"
          - cflags="${cflags% }"
          - >-
            test "$cflags" =
            "-I${pc_root}/include/curl-${{ version }}"
          - libs="$("${PREFIX}/bin/pkg-config" --libs libcurl)"
          - libs="${libs% }"
          - test "$libs" = "${pc_root}/lib/libcurl.so"
          - static_libs="$("${PREFIX}/bin/pkg-config" --static --libs libcurl)"
          - static_libs="${static_libs% }"
          - printf '%s\n' "$static_libs" | grep -F "${pc_root}/lib/libcurl.so"
          - printf '%s\n' "$static_libs" | grep -F "${pc_root}/lib/libnghttp2.so"
          - >-
            test "$("${PREFIX}/bin/pkg-config" --modversion libcurl)" =
            "${{ version }}"
          - curl_dependencies="$(ldd "${PREFIX}/bin/curl")"
          - >-
            echo "$curl_dependencies" | grep -F 'libcurl.so.4 =>' |
            grep -F "${PREFIX}/"
          - >-
            echo "$curl_dependencies" | grep -F 'libssl.so.3 =>' |
            grep -F "${PREFIX}/"
          - >-
            echo "$curl_dependencies" | grep -F 'libcrypto.so.3 =>' |
            grep -F "${PREFIX}/"
          - >-
            echo "$curl_dependencies" | grep -F 'libz.so.1 =>' |
            grep -F "${PREFIX}/"
          - test -f "${PREFIX}/etc/ssl/certs/ca-certificates.crt"
        files:
          recipe:
            - tests/probe.c
        requirements:
          run:
            - clang ==23.1.3
            - sysroot_linux-64 ==2.28
            - pkgconf ==3.0.7
  - package:
      name: libcurl
    build:
      number: 5
      string: meta_h${{ hash }}_${{ build_number }}
      noarch: generic
      script: "true"
    requirements:
      run:
        - ${{ pin_subpackage("curl", exact=True) }}
    tests:
      - script:
          - test -f "${PREFIX}/lib/libcurl.so.4"
          - curl --version | grep -F HTTP2

about:
  homepage: https://curl.se/
  license: curl
  license_file: COPYING
  summary: Command-line tool and library for transferring data with URLs
  description: Full native curl and libcurl with HTTP/2, SSH, Kerberos, PSL and compression support.
  repository: https://github.com/curl/curl
  documentation: https://curl.se/docs/
