schema_version: 1
context:
  version: 1.1.0
package:
  name: lua-lpeg
  version: ${{ version }}
source:
  - url: https://github.com/neovim/deps/raw/d495ee6f79e7962a53ad79670cb92488abe0b9b4/opt/lpeg-1.1.0.tar.gz
    sha256: 4b155d67d2246c1ffa7ad7bc466c1ea899bbc40fef0257cc9c03cecbaed4352a
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
  - path: CMakeLists.txt
build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - cmake ==3.31.8
    - ninja ==1.13.2
  run:
    - __glibc >=2.28
    - llvm-libgcc ==23.1.3
    - luajit ==2.1.1774638290
  host:
    - luajit ==2.1.1774638290
  run_exports:
    strong:
      - lua-lpeg ==1.1.0
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package lua-lpeg
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD LUA_PATH LUA_CPATH
      - luajit -e "local p=require('lpeg'); assert(p.match(p.P('hello'), 'hello')==6)"
    requirements:
      run:
        - luajit ==2.1.1774638290
about:
  homepage: https://github.com/neovim/deps
  license: MIT
  license_file:
    - lpeg.html
  summary: Parsing expression grammars for Lua
