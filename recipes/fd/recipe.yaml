schema_version: 1

context:
  version: "10.5.0"

package:
  name: fd
  version: ${{ version }}

source:
  - url: https://github.com/sharkdp/fd/archive/refs/tags/v${{ version }}.tar.gz
    sha256: e6d9e90730bf316101691e49d59cc02565278dc3779d33a77423801569484851
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 5
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - clang ==23.1.3
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
    - sysroot_linux-64 ==2.28
  host:
    - llvm-libgcc ==23.1.3
  run:
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package fd ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - fd
      files:
        - lib/devkit/share/bash-completion/completions/fd
        - lib/devkit/share/fish/vendor_completions.d/fd.fish
        - lib/devkit/share/man/man1/fd.1
        - lib/devkit/share/zsh/site-functions/_fd

  - script:
      - test "$(fd --version)" = "fd ${{ version }}"
      - test "$(fd -1 needle tests)" = "tests/needle.txt"
      - test -s "${PREFIX}/lib/devkit/share/man/man1/fd.1"
      - test -s "${PREFIX}/lib/devkit/share/bash-completion/completions/fd"
      - test -s "${PREFIX}/lib/devkit/share/fish/vendor_completions.d/fd.fish"
      - test -s "${PREFIX}/lib/devkit/share/zsh/site-functions/_fd"
    files:
      recipe:
        - tests/

  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/fd" | grep -F "(RUNPATH)"
      - ldd "${PREFIX}/bin/fd" | grep -F "libgcc_s.so.1 =>" | grep -F "${PREFIX}/"
about:
  homepage: https://github.com/sharkdp/fd
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  summary: A simple, fast, and user-friendly alternative to find
  description: A filesystem search tool built with the devkit-selected Rust toolchain.
  repository: https://github.com/sharkdp/fd
  documentation: https://github.com/sharkdp/fd/blob/master/README.md
