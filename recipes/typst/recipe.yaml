schema_version: 1

context:
  version: "0.15.1"

package:
  name: typst
  version: ${{ version }}

source:
  - url: https://github.com/typst/typst/archive/refs/tags/v${{ version }}.tar.gz
    sha256: c07909e01a2a6941e52c9b616e48c209c755eed416d62bcf5583c37a4aca01a3
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - pkgconf ==3.0.7
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
  host:
    - llvm-libgcc ==23.1.3
    - openssl ==3.5.9
  run:
    - __glibc >=2.28
    - llvm-libgcc ==23.1.3

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package typst
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - typst
      files:
        - lib/devkit/share/bash-completion/completions/typst
        - lib/devkit/share/fish/vendor_completions.d/typst.fish
        - lib/devkit/share/zsh/site-functions/_typst
        - lib/devkit/share/man/man1/typst.1
        - etc/conda/env_vars.d/typst.json
  - script:
      - typst --version | grep -F 'typst ${{ version }}'
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/typst" | grep -F '(RUNPATH)'
      - ldd "${PREFIX}/bin/typst" | grep -F 'libgcc_s.so.1 =>' | grep -F "${PREFIX}/"
      - ldd "${PREFIX}/bin/typst" | grep -F 'libssl.so.3 =>' | grep -F "${PREFIX}/"

about:
  homepage: https://typst.app/
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  summary: A markup-based typesetting system
  description: Typst with embedded fonts, PDF, SVG, PNG and HTML output, built from pinned source and Cargo.lock against channel OpenSSL and the glibc 2.28 sysroot.
  repository: https://github.com/typst/typst
  documentation: https://typst.app/docs/
