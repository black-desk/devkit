schema_version: 1

context:
  version: "15.2.0"

package:
  name: ripgrep
  version: ${{ version }}

source:
  - url: https://github.com/BurntSushi/ripgrep/archive/refs/tags/${{ version }}.tar.gz
    sha256: 7605249d3eb0d5f170e3414498e3344e26b1e7a147aec518b57090b80036a562
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 6
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - clang ==23.1.3
    - pkgconf ==3.0.7
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
    - sysroot_linux-64 ==2.28
  host:
    - pcre2 ==10.49
    - llvm-libgcc ==23.1.3
  run:
    - pcre2 >=10.49,<11
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package ripgrep ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - rg
      files:
        - lib/devkit/share/bash-completion/completions/rg
        - lib/devkit/share/fish/vendor_completions.d/rg.fish
        - lib/devkit/share/man/man1/rg.1
        - lib/devkit/share/zsh/site-functions/_rg

  - script:
      - test "$(rg --version | head -n 1)" = "ripgrep ${{ version }}"
      - test "$(rg --no-config -N needle tests/haystack.txt)" = needle
      - test "$(printf 'devkit42\n' | rg --no-config --pcre2 '(?<=devkit)[0-9]+')" = devkit42
      - rg --pcre2-version
      - test -s "${PREFIX}/lib/devkit/share/man/man1/rg.1"
      - test -s "${PREFIX}/lib/devkit/share/bash-completion/completions/rg"
      - test -s "${PREFIX}/lib/devkit/share/fish/vendor_completions.d/rg.fish"
      - test -s "${PREFIX}/lib/devkit/share/zsh/site-functions/_rg"
    files:
      recipe:
        - tests/

  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/rg" | grep -F "(RUNPATH)"
      - ldd "${PREFIX}/bin/rg" | grep -F "libgcc_s.so.1 =>" | grep -F "${PREFIX}/"
      - ldd "${PREFIX}/bin/rg" | grep -F "libpcre2-8.so.0 =>" | grep -F "${PREFIX}/"
about:
  homepage: https://github.com/BurntSushi/ripgrep
  license: Unlicense OR MIT
  license_file:
    - LICENSE-MIT
    - UNLICENSE
  summary: Ripgrep recursively searches directories for a regex pattern
  description: A fast line-oriented search tool built with the devkit-selected Rust toolchain.
  repository: https://github.com/BurntSushi/ripgrep
  documentation: https://github.com/BurntSushi/ripgrep/blob/master/GUIDE.md
