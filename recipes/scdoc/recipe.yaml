schema_version: 1

context:
  version: "1.11.3"

package:
  name: scdoc
  version: ${{ version }}

source:
  - url: https://git.sr.ht/~sircmpwn/scdoc/archive/1.11.3.tar.gz
    sha256: 4c5c6136540384e5455b250f768e7ca11b03fdba1a8efc2341ee0f1111e57612
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
  run:
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package scdoc
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh

about:
  homepage: https://git.sr.ht/~sircmpwn/scdoc
  license: MIT
  license_file: COPYING
  summary: Manual page generator for simple markup
