schema_version: 1

context:
  version: "1.13.2"

package:
  name: ninja
  version: ${{ version }}

source:
  - url: https://github.com/ninja-build/ninja/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17

  # Test-only GoogleTest source matches Ninja's upstream FetchContent pin.
  - url: https://github.com/google/googletest/releases/download/v1.16.0/googletest-1.16.0.tar.gz
    sha256: 78c676fc63881529bf97bf9d45948d905a66833fbfa5318ea2cd7478cb98f399
    target_directory: test-googletest
  - path: ../clang
    target_directory: devkit-build
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}

requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - sysroot_linux-64 ==2.28
  host:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
    - __glibc >=2.28

tests:
  - package_contents:
      bin:
        - ninja
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - test "$(ninja --version)" = "${{ version }}"
      - readelf -d "${PREFIX}/bin/ninja" | grep -F '(RUNPATH)'
      - ninja -f tests/build.ninja
      - cmp tests/input.txt copied.txt
      - ninja -f tests/build.ninja | grep -F 'no work to do'
    files:
      recipe:
        - tests/

about:
  homepage: https://ninja-build.org/
  license: Apache-2.0
  license_file: COPYING
  summary: Ninja build executor built with Clang and channel libc++
  repository: https://github.com/ninja-build/ninja
