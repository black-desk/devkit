schema_version: 1

context:
  version: "26.9.1"

package:
  name: yazi
  version: ${{ version }}

source:
  - url: https://github.com/sxyazi/yazi/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 66857f1b670469daf258edd0bb2ea51d9ad3e2cab4eea9684028c80059fd6862
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 3
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - clang ==23.1.3
    - make ==4.4.1
    - sysroot_linux-64 ==2.28
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
  run:
    - __glibc >=2.28
    - git >=2.56.0,<3
    - fd >=10.5.0,<11
    - ripgrep >=15,<16
    - llvm-libgcc ==23.1.3
  host:
    - llvm-libgcc ==23.1.3
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package yazi ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - yazi
        - ya
      files:
        - lib/devkit/share/bash-completion/completions/yazi
        - lib/devkit/share/fish/vendor_completions.d/yazi.fish
        - lib/devkit/share/zsh/site-functions/_yazi
        - lib/devkit/share/bash-completion/completions/ya
        - lib/devkit/share/fish/vendor_completions.d/ya.fish
        - lib/devkit/share/zsh/site-functions/_ya
  - script:
      - yazi --version | grep -F '26.9.1 (no-gitcl 2026-09-01)'
      - ya --version | grep -F '26.9.1 (no-gitcl 2026-09-01)'
      - ya --help
      - python -I tests/terminal.py
    requirements:
      run:
        - python ==3.14.8
    files:
      recipe:
        - tests/

  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - readelf -d "${PREFIX}/bin/yazi" | grep -F "(RUNPATH)"
      - ldd "${PREFIX}/bin/yazi" | grep -F "libgcc_s.so.1 =>" | grep -F "${PREFIX}/"
      - readelf -d "${PREFIX}/bin/ya" | grep -F "(RUNPATH)"
      - ldd "${PREFIX}/bin/ya" | grep -F "libgcc_s.so.1 =>" | grep -F "${PREFIX}/"
about:
  homepage: https://github.com/sxyazi/yazi
  license: MIT
  license_file: LICENSE
  summary: Terminal file manager with asynchronous previews
  description: Built from pinned upstream source and Cargo.lock with the devkit Rust toolchain and glibc 2.28 sysroot.
  repository: https://github.com/sxyazi/yazi
