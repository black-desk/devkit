schema_version: 1

context:
  version: "26.9.1"

package:
  name: yazi
  version: ${{ version }}

source:
  url: https://github.com/sxyazi/yazi/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 66857f1b670469daf258edd0bb2ea51d9ad3e2cab4eea9684028c80059fd6862

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh

requirements:
  build:
    - gcc ==16.2.0
    - binutils ==2.46.1
    - make ==4.4.1
    - sysroot_linux-64 ==2.28 h8204064_0
    - rustup ==1.29.1
    - rust-toolchain-lock ==1.98.1
  run:
    - __glibc >=2.28
    - git >=2.56.0,<3
    - fd >=10.5.0,<11
    - ripgrep >=15,<16

tests:
  - package_contents:
      bin:
        - yazi
        - ya
      files:
        - share/bash-completion/completions/yazi
        - share/fish/vendor_completions.d/yazi.fish
        - share/zsh/site-functions/_yazi
        - share/bash-completion/completions/ya
        - share/fish/vendor_completions.d/ya.fish
        - share/zsh/site-functions/_ya
  - script:
      - yazi --version | grep -F '26.9.1 (no-gitcl 2026-09-01)'
      - ya --version | grep -F '26.9.1 (no-gitcl 2026-09-01)'
      - ya --help
      - python -I tests/terminal.py
    requirements:
      run:
        - python ==3.14.8
    files:
      recipe:
        - tests/

about:
  homepage: https://github.com/sxyazi/yazi
  license: MIT
  license_file: LICENSE
  summary: Terminal file manager with asynchronous previews
  description: Built from pinned upstream source and Cargo.lock with the devkit Rust toolchain and glibc 2.28 sysroot.
  repository: https://github.com/sxyazi/yazi
