schema_version: 1
context:
  version: 0.5.0
package:
  name: tree-sitter-lua
  version: ${{ version }}
source:
  - url: https://github.com/tree-sitter-grammars/tree-sitter-lua/archive/v0.5.0.tar.gz
    sha256: cf01b93f4b61b96a6d27942cf28eeda4cbce7d503c3bef773a8930b3d778a2d9
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
  - path: CMakeLists.txt
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - cmake ==3.31.8
    - ninja ==1.13.2
  run:
    - __glibc >=2.28
    - libtree-sitter ==0.26.13
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package tree-sitter-lua
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/lib/nvim/parser/lua.so
  - script:
      - python3 -c "import ctypes as c, os; root=os.environ['PREFIX']+'/lib/devkit/lib/'; runtime=c.CDLL(root+'libtree-sitter.so'); runtime.ts_parser_new.restype=c.c_void_p; parser=runtime.ts_parser_new(); assert(parser); grammar=c.CDLL(root+'nvim/parser/lua.so'); grammar.tree_sitter_lua.restype=c.c_void_p; runtime.ts_parser_set_language.argtypes=[c.c_void_p,c.c_void_p]; assert(runtime.ts_parser_set_language(parser,grammar.tree_sitter_lua())); runtime.ts_parser_delete.argtypes=[c.c_void_p]; runtime.ts_parser_delete(parser)"
about:
  homepage: https://github.com/tree-sitter-grammars/tree-sitter-lua
  license: MIT
  license_file:
    - LICENSE.md
  summary: Tree-sitter lua parser modules
