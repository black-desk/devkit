schema_version: 1
context:
  version: "1.52.1"
package:
  name: libuv
  version: ${{ version }}
source:
  - url: https://dist.libuv.org/dist/v${{ version }}/libuv-v${{ version }}.tar.gz
    sha256: 66d511b9e6e334c0e62279eb234fbfb2b3110b1479c09b95b44c7afca8cff9e7
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 5
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - sysroot_linux-64 ==2.28
  run_exports:
    strong:
      - libuv >=1.52.1,<2
  run:
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libuv
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/include/libuv-${{ version }}/uv.h
        - lib/devkit/include/libuv-${{ version }}/uv/unix.h
        - lib/devkit/lib/libuv.so
        - lib/libuv.so.1
        - lib/devkit/lib/libuv.a
        - lib/devkit/lib/pkgconfig/libuv.pc
        - lib/devkit/lib/pkgconfig/libuv-static.pc
        - lib/devkit/lib/cmake/libuv/libuvConfig.cmake
  - script:
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" -O2
        -I"${PREFIX}/lib/devkit/include/libuv-${{ version }}"
        tests/probe.c "${PREFIX}/lib/devkit/lib/libuv.so"
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o uv-probe
      - ./uv-probe "${{ version }}"
      - readelf -d "${PREFIX}/lib/libuv.so.1" | grep -F '(RUNPATH)'
      - test ! -e "${PREFIX}/include/uv.h"
      - export PKG_CONFIG_PATH="${PREFIX}/lib/devkit/lib/pkgconfig"
      - pkg-config --cflags libuv | grep -F '/include/libuv-${{ version }}'
      - pkg-config --libs libuv | grep -F -- '-luv'
      - static_libs="$(pkg-config --libs libuv-static)"
      - >-
        for library in pthread dl rt m; do
        printf '%s\n' "$static_libs" | grep -F -- "-l${library}";
        done
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" -O2
        $(pkg-config --cflags libuv-static) tests/probe.c
        ${static_libs}
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o uv-static-probe
      - ./uv-static-probe "${{ version }}"
      - >-
        if readelf -d uv-static-probe | grep -F 'Shared library: [libuv.so';
        then exit 1; fi
    requirements:
      run:
        - pkgconf ==3.0.7
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
    files:
      recipe:
        - tests/probe.c
about:
  homepage: https://libuv.org/
  license: MIT
  license_file:
    - LICENSE
    - LICENSE-extra
  summary: Asynchronous I/O library with filesystem, networking and threading support
