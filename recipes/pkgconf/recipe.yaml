schema_version: 1

context:
  version: "3.0.7"

package:
  name: pkgconf
  version: ${{ version }}

source:
  - url: https://github.com/pkgconf/pkgconf/archive/pkgconf-${{ version }}.tar.gz
    sha256: a9ae678879771fcf15247ac2435e7ad8308be8a5921898e6720b3b8949410f73
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 5
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      PKGCONF_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}

  dynamic_linking:
    binary_relocation: false
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - ninja >=1.13.2,<1.14
    - sysroot_linux-64 ==2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package pkgconf ${{ '--allow-seed-runtime-aliases' if sysroot_triplet | default('') == 'x86_64-conda-linux-gnu' else '' }}
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - pkgconf
        - pkg-config

  - script:
      - bash tests/discovery.sh
      - test "$(readlink "${PREFIX}/bin/pkg-config")" = pkgconf
      - version_output="$(${PREFIX}/bin/pkgconf --version)"
      - test "${version_output}" = "${{ version }}"
      - compatibility_output="$(${PREFIX}/bin/pkg-config --version)"
      - test "${compatibility_output}" = "${{ version }}"
      - >-
        printf '%s\n' "prefix=${PREFIX}" 'Name: devkit-smoke'
        'Description: pkgconf smoke metadata' 'Version: 1.2.3'
        "Cflags: -I${PREFIX}/include/devkit-smoke"
        "Libs: ${PREFIX}/lib/devkit/lib/libdevkit-smoke.so" >
        "${PWD}/devkit-smoke.pc"
      - export PKG_CONFIG_PATH="${PWD}"
      - modversion_output="$(${PREFIX}/bin/pkg-config --modversion devkit-smoke)"
      - test "${modversion_output}" = "1.2.3"
      - cflags_output="$(${PREFIX}/bin/pkg-config --cflags devkit-smoke)"
      - test "${cflags_output}" = "-I${PREFIX}/include/devkit-smoke"
      - libs_output="$(${PREFIX}/bin/pkg-config --libs devkit-smoke)"
      - test "${libs_output}" = "${PREFIX}/lib/devkit/lib/libdevkit-smoke.so"
    files:
      recipe:
        - tests/

about:
  homepage: https://gitea.pkgconf.dev/pkgconf/pkgconf
  license: ISC
  license_file: COPYING
  summary: Package compiler and linker metadata toolkit
  description: The pkgconf command with a pkg-config compatibility name, used to validate channel package metadata.
  repository: https://github.com/pkgconf/pkgconf
  documentation: https://gitea.pkgconf.dev/pkgconf/pkgconf
