schema_version: 1
context:
  version: 0.5.3
package:
  name: tree-sitter-markdown
  version: ${{ version }}
source:
  - url: https://github.com/tree-sitter-grammars/tree-sitter-markdown/archive/v0.5.3.tar.gz
    sha256: df845b1ab7c7c163ec57d7fa17170c92b04be199bddab02523636efec5224ab6
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
  - path: CMakeLists.txt
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - cmake ==3.31.8
    - ninja ==1.13.2
  run:
    - __glibc >=2.28
    - libtree-sitter ==0.26.13
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package tree-sitter-markdown
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/lib/nvim/parser/markdown.so
        - lib/devkit/lib/nvim/parser/markdown_inline.so
  - script:
      - python3 -c "import ctypes as c, os; root=os.environ['PREFIX']+'/lib/devkit/lib/'; runtime=c.CDLL(root+'libtree-sitter.so'); runtime.ts_parser_new.restype=c.c_void_p; parser=runtime.ts_parser_new(); assert(parser); grammar=c.CDLL(root+'nvim/parser/markdown.so'); grammar.tree_sitter_markdown.restype=c.c_void_p; runtime.ts_parser_set_language.argtypes=[c.c_void_p,c.c_void_p]; assert(runtime.ts_parser_set_language(parser,grammar.tree_sitter_markdown())); runtime.ts_parser_delete.argtypes=[c.c_void_p]; runtime.ts_parser_delete(parser)"
      - python3 -c "import ctypes as c, os; root=os.environ['PREFIX']+'/lib/devkit/lib/'; runtime=c.CDLL(root+'libtree-sitter.so'); runtime.ts_parser_new.restype=c.c_void_p; parser=runtime.ts_parser_new(); assert(parser); grammar=c.CDLL(root+'nvim/parser/markdown_inline.so'); grammar.tree_sitter_markdown_inline.restype=c.c_void_p; runtime.ts_parser_set_language.argtypes=[c.c_void_p,c.c_void_p]; assert(runtime.ts_parser_set_language(parser,grammar.tree_sitter_markdown_inline())); runtime.ts_parser_delete.argtypes=[c.c_void_p]; runtime.ts_parser_delete(parser)"
about:
  homepage: https://github.com/tree-sitter-grammars/tree-sitter-markdown
  license: MIT
  license_file:
    - LICENSE
  summary: Tree-sitter markdown parser modules
