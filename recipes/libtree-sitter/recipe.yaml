schema_version: 1
context:
  version: 0.26.13
package:
  name: libtree-sitter
  version: ${{ version }}
source:
  - url: https://github.com/tree-sitter/tree-sitter/archive/v0.26.13.tar.gz
    sha256: ece24c3c5e2a76384075e830c7139b59fce8fb01e4ef8436fab08bbe10444c89
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - cmake ==3.31.8
    - ninja ==1.13.2
  run:
    - __glibc >=2.28
    - llvm-libgcc ==23.1.3
  run_exports:
    strong:
      - libtree-sitter ==0.26.13
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libtree-sitter
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - python3 -c "import ctypes, os; lib=ctypes.CDLL(os.environ['PREFIX']+'/lib/devkit/lib/libtree-sitter.so'); lib.ts_parser_new.restype=ctypes.c_void_p; p=lib.ts_parser_new(); assert(p); lib.ts_parser_delete.argtypes=[ctypes.c_void_p]; lib.ts_parser_delete(p)"
about:
  homepage: https://github.com/tree-sitter/tree-sitter
  license: MIT AND Unicode-DFS-2016
  license_file:
    - LICENSE
    - lib/src/unicode/LICENSE
  summary: Incremental parsing runtime
