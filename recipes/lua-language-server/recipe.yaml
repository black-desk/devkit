schema_version: 1
context:
  version: 3.19.2
package:
  name: lua-language-server
  version: ${{ version }}
source:
  - url: https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-submodules.zip
    sha256: 819ecf3bba08c1e6ea182c78d0236990004d47651cc5165aaafc879cb0d71444
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build
build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  skip: not linux or not x86_64
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - ninja ==1.13.2
    - python ==3.14.8
  host:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
  run:
    - libcxx ==23.1.3
    - llvm-libgcc ==23.1.3
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package lua-language-server
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - lua-language-server
  - script:
      - lua-language-server --version | grep -F 3.19.2
about:
  homepage: https://github.com/LuaLS/lua-language-server
  repository: https://github.com/LuaLS/lua-language-server
  license: MIT
  license_file: LICENSE
  summary: Lua language server with embedded Lua and code formatting
