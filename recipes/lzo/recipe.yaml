schema_version: 1
context:
  version: "2.10"
package:
  name: lzo
  version: ${{ version }}
source:
  - url: https://www.oberhumer.com/opensource/lzo/download/lzo-${{ version }}.tar.gz
    sha256: c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072
    patches:
      - patches/development-install.patch
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 3
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - cmake ==3.31.8
    - ninja ==1.13.2
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  run_exports:
    strong:
      - lzo >=2.10,<3
  run:
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package lzo
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      files:
        - lib/devkit/include/lzo-${{ version }}/lzo/*.h
        - lib/devkit/lib/liblzo2.so
        - lib/liblzo2.so.*
        - lib/devkit/lib/liblzo2.a
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - >-
        "${PREFIX}/bin/clang" --no-default-config
        --config="${PREFIX}/share/devkit/clang.cfg" -O2 -fPIC
        -I"${PREFIX}/lib/devkit/include/lzo-${{ version }}"
        tests/probe.c "${PREFIX}/lib/devkit/lib/liblzo2.so"
        "-Wl,--enable-new-dtags,-rpath,${PREFIX}/lib" -o library-probe
      - ./library-probe
      - readelf -d "${PREFIX}/lib/devkit/lib/liblzo2.so" | grep -F '(RUNPATH)'
    files:
      recipe:
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
about:
  homepage: https://www.oberhumer.com/opensource/lzo/
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Fast lossless compression library with LZO1X support
