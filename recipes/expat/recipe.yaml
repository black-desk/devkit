schema_version: 1

context:
  version: "2.8.5"

recipe:
  name: expat
  version: ${{ version }}

source:
  - url: https://github.com/libexpat/libexpat/releases/download/R_2_8_5/expat-${{ version }}.tar.xz
    sha256: 1e727b8933ec51a77a9a9d9afcf8e688bce45d907c13e36ab7393fe36e703182
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

outputs:
  - package:
      name: expat
    build:
      number: 3
      string: h${{ hash }}_${{ build_number }}
      script:
        file: build.sh
        env:
          DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
          EXPAT_VERSION: ${{ version }}
          SYSROOT_TRIPLET: ${{ sysroot_triplet }}

      dynamic_linking:
        binary_relocation: false
    requirements:
      ignore_run_exports:
        from_package:
          - libcxx
          - llvm-libgcc
      build:
        - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
          then:
            - clang-23 ==23.1.3
            - llvm-tools ==23.1.3
            - lld ==23.1.2
            - libgcc-devel_linux-64 ==16.2.0
          else:
            - clang ==23.1.3
        - gnuconfig ==2025.07.09
        - make ==4.4.1
        - sysroot_linux-64 ==2.28
      host:
        - libcxx ==23.1.3
        - llvm-libgcc ==23.1.3
      run:
        - __glibc >=2.28
      run_exports:
        strong:
          - expat >=2.8.5,<2.9

    tests:
      - script:
          - python3 devkit-build/check-package.py "${PREFIX}" --package expat
        files:
          source:
            - devkit-build/check-package.py
      - package_contents:
          bin:
            - xmlwf
          files:
            - lib/devkit/include/expat-${{ version }}/expat.h
            - lib/devkit/include/expat-${{ version }}/expat_external.h
            - lib/devkit/include/expat-${{ version }}/expat_config.h
            - lib/devkit/lib/libexpat.so
            - lib/libexpat.so.1
            - lib/libexpat.so.1.12.5
            - lib/devkit/lib/libexpat.a
            - share/man/man1/xmlwf.1
            - lib/devkit/lib/pkgconfig/expat.pc
            - lib/devkit/lib/cmake/expat-2.8.5/expat.cmake

      - script:
          - unset LD_LIBRARY_PATH LD_PRELOAD
          - ln -s "${PREFIX}/lib" runtime-lib
          - ./library-probe | grep -Fx devkit
          - xmlwf -v | grep -F expat_2.8.5
          - printf '<devkit/>\n' > valid.xml
          - xmlwf valid.xml
          - printf '<devkit>\n' > invalid.xml
          - if xmlwf invalid.xml; then exit 1; fi
          - readelf -d "${PREFIX}/lib/devkit/lib/libexpat.so" | grep -F '(RUNPATH)'
          - export PKG_CONFIG_PATH="${PREFIX}/lib/devkit/lib/pkgconfig"
          - test "$(command -v pkg-config)" = "${PREFIX}/bin/pkg-config"
          - pc_path="$("${PREFIX}/bin/pkg-config" --path expat)"
          - cflags="$("${PREFIX}/bin/pkg-config" --cflags expat)"
          - cflags="${cflags% }"
          - test "$cflags" = "-I$(dirname "$pc_path")/../../include/expat-${{ version }}"
          - libs="$("${PREFIX}/bin/pkg-config" --libs expat)"
          - libs="${libs% }"
          - test "$libs" = "$(dirname "$pc_path")/../../lib/libexpat.so"
          - >-
            test "$("${PREFIX}/bin/pkg-config" --modversion expat)" = "${{ version
            }}"
          - test ! -e "${PREFIX}/include/expat.h"
          - >-
            grep -F 'INTERFACE_INCLUDE_DIRECTORIES "${_IMPORT_PREFIX}/include/expat-${{ version }}"'
            "${PREFIX}/lib/devkit/lib/cmake/expat-${{ version }}/expat.cmake"
        files:
          source:
            - library-probe
        requirements:
          run:
            - pkgconf ==3.0.7
  - package:
      name: libexpat
    build:
      number: 3
      string: meta_h${{ hash }}_${{ build_number }}
      noarch: generic
      script: "true"
    requirements:
      run:
        - ${{ pin_subpackage("expat", exact=True) }}
    tests:
      - script:
          - test -f "${PREFIX}/lib/libexpat.so.1"
          - xmlwf -v | grep -F expat_2.8.5

about:
  homepage: https://github.com/libexpat/libexpat
  license: MIT
  license_file: COPYING
  summary: Stream-oriented XML parser library
  description: The Expat stream-oriented XML parser library used by Git's dumb HTTP transport.
  repository: https://github.com/libexpat/libexpat
  documentation: https://libexpat.github.io/doc/
