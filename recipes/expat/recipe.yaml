schema_version: 1

context:
  version: "2.8.5"

package:
  name: expat
  version: ${{ version }}

source:
  url: https://github.com/libexpat/libexpat/releases/download/R_2_8_5/expat-${{ version }}.tar.xz
  sha256: 1e727b8933ec51a77a9a9d9afcf8e688bce45d907c13e36ab7393fe36e703182

build:
  number: 0
  string: h${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      EXPAT_VERSION: ${{ version }}
      SYSROOT_TRIPLET: x86_64-pc-linux-gnu

requirements:
  build:
    - gcc ==16.2.0 meta_hb0f4dca_0
    - binutils ==2.46.1 h8204064_0
    - gnuconfig ==2025.07.09 h4616a5c_0
    - make ==4.4.1 h8204064_0
    - sysroot_linux-64 ==2.28 h8204064_0
  run_exports:
    strong:
      - expat >=2.8.5,<2.9

tests:
  - package_contents:
      files:
        - include/expat-${{ version }}/expat.h
        - include/expat-${{ version }}/expat_external.h
        - include/expat-${{ version }}/expat_config.h
        - lib/libexpat.so
        - lib/libexpat.so.1
        - lib/libexpat.so.1.12.5
        - lib/libexpat.a
        - lib/pkgconfig/expat.pc
        - lib/cmake/expat-2.8.5/expat.cmake

  - script:
      - export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"
      - test "$(command -v pkg-config)" = "${PREFIX}/bin/pkg-config"
      - pc_path="$("${PREFIX}/bin/pkg-config" --path expat)"
      - cflags="$("${PREFIX}/bin/pkg-config" --cflags expat)"
      - cflags="${cflags% }"
      - test "$cflags" = "-I$(dirname "$pc_path")/../../include/expat-${{ version }}"
      - libs="$("${PREFIX}/bin/pkg-config" --libs expat)"
      - libs="${libs% }"
      - test "$libs" = "$(dirname "$pc_path")/../../lib/libexpat.so"
      - >-
        test "$("${PREFIX}/bin/pkg-config" --modversion expat)" = "${{ version
        }}"
      - test ! -e "${PREFIX}/include/expat.h"
      - >-
        grep -F 'INTERFACE_INCLUDE_DIRECTORIES "${_IMPORT_PREFIX}/include/expat-${{ version }}"'
        "${PREFIX}/lib/cmake/expat-${{ version }}/expat.cmake"
    requirements:
      run:
        - pkgconf ==3.0.7 hb0f4dca_0

about:
  homepage: https://github.com/libexpat/libexpat
  license: MIT
  license_file: COPYING
  summary: Stream-oriented XML parser library
  description: The Expat stream-oriented XML parser library used by Git's dumb HTTP transport.
  repository: https://github.com/libexpat/libexpat
  documentation: https://libexpat.github.io/doc/
