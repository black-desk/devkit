schema_version: 1

context:
  version: "3.0.2"

package:
  name: libassuan
  version: ${{ version }}

source:
  - url: https://www.gnupg.org/ftp/gcrypt/libassuan/libassuan-3.0.2.tar.bz2
    sha256: d2931cdad266e633510f9970e1a2f346055e351bb19f9b78912475b8074c36f6
    patches:
      - patches/clang-driver-link-policy.patch
  - path: ../../scripts/packaging/finalize-elf.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 1
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh

requirements:
  build:
    - clang ==23.1.3
    - sysroot_linux-64 ==2.28
    - make ==4.4.1
    - pkgconf ==3.0.7
    - python ==3.14.8
  host:
    - libgpg-error ==1.51
  run:
    - libgpg-error >=1.51,<2
    - __glibc >=2.28

tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package libassuan
    files:
      source:
        - devkit-build/check-package.py
  - script:
      - bash tests/smoke.sh
    files:
      recipe:
        - tests/smoke.sh
        - tests/probe.c
    requirements:
      run:
        - clang ==23.1.3
        - sysroot_linux-64 ==2.28
        - pkgconf ==3.0.7

about:
  homepage: https://www.gnupg.org/software/libassuan/
  license: LGPL-2.1-or-later
  license_file: COPYING.LIB
  summary: GnuPG IPC library
