schema_version: 1
context:
  version: "1.10.0"
package:
  name: lz4-c
  version: ${{ version }}
source:
  - url: https://github.com/lz4/lz4/archive/v${{ version }}.tar.gz
    sha256: 537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b
    patches:
      - patches/development-install.patch
  - path: ../../scripts/packaging/stage-development.py
    target_directory: devkit-build
  - path: ../../scripts/packaging/check-package.py
    target_directory: devkit-build

build:
  number: 2
  string: h${{ hash }}_${{ build_number }}
  dynamic_linking:
    binary_relocation: false
  script:
    file: build.sh
    env:
      DEVKIT_RUN_TESTS: ${{ env.get("DEVKIT_RUN_TESTS", default="1") }}
      LIBRARY_VERSION: ${{ version }}
      SYSROOT_TRIPLET: ${{ sysroot_triplet }}
requirements:
  build:
    - if: sysroot_triplet == 'x86_64-conda-linux-gnu'
      then:
        - clang-23 ==23.1.3
        - llvm-tools ==23.1.3
        - lld ==23.1.2
        - libgcc-devel_linux-64 ==16.2.0
      else:
        - clang ==23.1.3
    - make ==4.4.1
    - gnuconfig ==2025.07.09
    - sysroot_linux-64 ==2.28
  run_exports:
    strong:
      - lz4-c >=1.10.0,<2
  run:
    - __glibc >=2.28
tests:
  - script:
      - python3 devkit-build/check-package.py "${PREFIX}" --package lz4-c
    files:
      source:
        - devkit-build/check-package.py
  - package_contents:
      bin:
        - lz4
        - lz4c
        - lz4cat
        - unlz4
      files:
        - lib/devkit/include/lz4-${{ version }}/*.h
        - lib/devkit/lib/liblz4.so
        - lib/liblz4.so.*
        - lib/devkit/lib/liblz4.a
  - script:
      - unset LD_LIBRARY_PATH LD_PRELOAD
      - ln -s "${PREFIX}/lib" runtime-lib
      - ./library-probe
      - printf 'devkit lz4 roundtrip\n' > input.txt
      - lz4 -f input.txt output.lz4
      - lz4 -df output.lz4 output.txt
      - cmp input.txt output.txt
      - readelf -d "${PREFIX}/lib/devkit/lib/liblz4.so" | grep -F '(RUNPATH)'
    files:
      source:
        - library-probe
about:
  homepage: https://github.com/lz4/lz4
  license: BSD-2-Clause AND GPL-2.0-or-later
  license_file:
    - lib/LICENSE
    - programs/COPYING
  summary: LZ4 compression library and command-line tools
